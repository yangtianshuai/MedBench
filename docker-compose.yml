# 医院智能问数 · 单机部署编排
#
# 三条约定（改之前先看）：
#   1. **var/ 必须挂出来**：元数据库、审计库、审计链 HMAC 密钥、运行时配置都在里面。
#      不挂 = 每次重启全部丢失，审计链断裂（等于自毁"可追责"这个卖点）。
#   2. **semantic-layer/ 建议挂只读**：口径调整不必重新打镜像，
#      改完调 /api/admin/pipeline/reload 热载即可；挂 ro 是防止容器内误改资产。
#   3. **默认走 ADS 宽表（ASK_DS=ads）**：直连 HIS 需要院方提供 Oracle Instant
#      Client 11.2 与授权，且必须 thick mode；镜像里刻意不带（见 Dockerfile 注释）。
#
# 首次启动后创建管理员（一次性口令只显示一次）：
#   docker compose exec app python -m app.core.local_accounts \
#       --create-admin u0001 --name 信息科管理员 --reason 部署单号 --role 信息科

services:
  app:
    build: .
    image: med-ask:0.1.0
    container_name: med-ask
    restart: unless-stopped
    ports:
      - "${ASK_PORT:-8000}:8000"
    environment:
      # ── 数据源：ads = 本地宽表（默认）；his = 直连镜像库 ──
      ASK_DS: "${ASK_DS:-ads}"
      ASK_ADS: /app/var/ads.db
      # ASK_HIS_HOST: "10.1.33.46"
      # ASK_HIS_SERVICE: "ORCL"
      # ASK_HIS_USER: "ask_ro"            # 只读账号，禁用应用账号
      # ASK_HIS_PASSWORD: "${ASK_HIS_PASSWORD:?需要注入只读口令}"
      # ASK_HIS_THICK: "1"                 # 11.2 必须 thick；需挂载 Instant Client

      # ── 鉴权：demo 只能绑环回，容器里必须换成 sso / gateway ──
      # ★ 合法取值只有 demo / gateway / sso（identity.VALID_MODES）。
      #   "local" 不是身份模式，它是「本地账号」这个**凭证入口**，由下面两项组合启用：
      #     ASK_AUTH_MODE=sso      + ASK_AUTH_LOCAL=primary
      #   两者缺一：mode=local → 每个请求 bad_mode；local=on → 不在 (primary|breakglass) 内，
      #   登录入口不开，页面上不会出现登录框（security_gate.local_warnings 会告警）。
      ASK_AUTH_MODE: "${ASK_AUTH_MODE:-sso}"
      ASK_AUTH_LOCAL: "${ASK_AUTH_LOCAL:-primary}"

      # ── 模型：必须指向院内私有化服务，密钥只走环境变量 ──
      ASK_LLM_BASE_URL: "${ASK_LLM_BASE_URL:-}"
      ASK_LLM_MODEL: "${ASK_LLM_MODEL:-}"
      ASK_LLM_API_KEY: "${ASK_LLM_API_KEY:-}"
      ASK_LLM_TIMEOUT: "${ASK_LLM_TIMEOUT:-60}"

      # ── 执行层限流（保护 HIS）：并发闸 + 每分钟速率闸 ──
      ASK_QUERY_MAX_CONCURRENT: "${ASK_QUERY_MAX_CONCURRENT:-4}"
      ASK_QUERY_PER_MINUTE: "${ASK_QUERY_PER_MINUTE:-120}"

      # ── Few-shot 默认关（未跑出 G1 vs G2 增益前不开）──
      ASK_FEWSHOT: "${ASK_FEWSHOT:-0}"
      TZ: Asia/Shanghai
    volumes:
      - ./var:/app/var
      - ./semantic-layer:/app/semantic-layer:ro
      # 直连 HIS（thick mode）时按院方实际路径挂载：
      # - /opt/oracle/instantclient_11_2:/opt/oracle/instantclient_11_2:ro
    # 单实例上限：宁可限流后变慢，也不要因内存打满把整院网络出口拖垮
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
