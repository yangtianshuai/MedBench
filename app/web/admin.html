<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>管理端 · 医院智能问数</title>
<style>
  :root{--bd:#e3e6ea;--pri:#1a5fb4;--ok:#1a7f37;--warn:#9a6700;--bad:#b42318;--bg:#f6f8fa}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.6 "Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:#1f2328}
  header{background:#fff;border-bottom:1px solid var(--bd);padding:10px 18px;display:flex;gap:16px;align-items:center}
  header h1{font-size:16px;margin:0;color:var(--pri)}
  .spacer{flex:1}
  a{color:var(--pri);text-decoration:none}
  .layout{display:flex;max-width:1280px;margin:16px auto;padding:0 16px;gap:16px;align-items:flex-start}
  nav.side{width:190px;background:#fff;border:1px solid var(--bd);border-radius:8px;padding:6px;flex:none}
  nav.side button{display:block;width:100%;text-align:left;border:none;background:none;padding:9px 12px;
    border-radius:6px;cursor:pointer;font:inherit}
  nav.side button:hover{background:#f0f4f9}
  nav.side button.on{background:#e8f0fb;color:var(--pri);font-weight:600}
  main{flex:1;min-width:0}
  .card{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:14px;margin-bottom:14px}
  .card h3{margin:0 0 10px;font-size:15px}
  label{display:block;margin:10px 0 3px;font-size:13px;color:#57606a}
  input,select{width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;font:inherit}
  input:disabled{background:#f0f2f4;color:#8b949e}
  button{padding:7px 14px;border:1px solid var(--bd);background:#fff;border-radius:6px;cursor:pointer;font:inherit}
  button.primary{background:var(--pri);color:#fff;border-color:var(--pri)}
  button:hover{opacity:.9}
  .row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  .bar{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
  .bar span{background:#f0f4f9;border:1px solid var(--bd);border-radius:4px;padding:2px 8px;font-size:12px}
  .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;border:1px solid}
  .b-ok{color:var(--ok);border-color:var(--ok);background:#e9f7ee}
  .b-off{color:#57606a;border-color:#57606a;background:#f0f0f0}
  .b-warn{color:var(--warn);border-color:var(--warn);background:#fff8e6}
  .muted{color:#57606a;font-size:12px}
  .warn{background:#fff8e6;border:1px solid #f0d98a;padding:8px 10px;border-radius:6px;margin-top:10px;font-size:13px}
  .ok{background:#e9f7ee;border:1px solid #9ad3ae;padding:8px 10px;border-radius:6px;margin-top:10px;font-size:13px}
  table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}
  th,td{border:1px solid var(--bd);padding:5px 8px;text-align:left;vertical-align:top}
  th{background:#f6f8fa}
  pre{background:#f6f8fa;border:1px solid var(--bd);padding:8px;overflow:auto;font-size:12px;max-height:260px}
  .kv{display:grid;grid-template-columns:150px 1fr;gap:4px 10px;font-size:13px}
  .kv b{font-weight:600;color:#57606a}
  nav.side .grp{font-size:12px;color:#57606a;padding:12px 12px 4px}
  .readonly{background:#f6f8fa;border:1px dashed var(--bd);border-radius:6px;padding:8px 10px;margin-top:10px}
  .readonly .kv{grid-template-columns:120px 1fr}
  .b-bad{color:var(--bad);border-color:var(--bad);background:#fdeceb}
  textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;font:inherit;min-height:60px}
  .inline{display:inline;width:auto}
  /* ── 品牌区：与问数客户端同一套观感（原来只有一行蓝字，像内部后台）── */
  header .brand{display:flex;align-items:center;gap:10px}
  header .brand-mark{width:30px;height:30px;border-radius:8px;background:var(--pri);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700}
  header h1{font-size:15px;margin:0;color:#1f2328;font-weight:600;line-height:1.25}
  header .tagline{font-size:11px;color:#57606a;line-height:1.35}
  .card{box-shadow:0 1px 2px rgba(16,24,40,.04)}
  input{background:#fbfcfd}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);background:#fff;
    box-shadow:0 0 0 3px rgba(26,95,180,.10)}
  .danger{background:#fdeceb;border:1px solid #f0a9a2;padding:8px 10px;border-radius:6px;
          margin-top:10px;font-size:13px}
  /* ── 登录 / 改密弹层（与客户端同一套；遮罩不可点关闭）── */
  .modal{position:fixed;inset:0;background:rgba(23,28,35,.45);display:flex;align-items:center;
         justify-content:center;z-index:50;padding:20px;overflow:auto}
  .modal .box{background:#fff;border-radius:12px;width:100%;max-width:400px;padding:26px;
              box-shadow:0 18px 48px rgba(16,24,40,.20);height:fit-content}
  .modal .brandrow{display:flex;align-items:center;gap:11px;margin-bottom:18px}
  .modal .logo{width:36px;height:36px;border-radius:9px;background:var(--pri);color:#fff;
               display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700}
  .modal h2{margin:0;font-size:17px;line-height:1.3;font-weight:600}
  .modal .sub{font-size:12px;color:#57606a;margin-top:1px}
  .modal label.field{display:block;font-size:12px;color:#57606a;margin-top:14px}
  .modal input.field{width:100%;padding:10px 11px;margin-top:5px;border:1px solid var(--bd);
                     border-radius:7px;background:#fbfcfd;font-size:14px}
  .modal .actions{display:flex;align-items:center;gap:10px;margin-top:18px}
  .modal .btn-main{flex:1;background:var(--pri);color:#fff;border-color:var(--pri);
                   padding:10px 16px;border-radius:7px;font-weight:600}
  .modal .msg{color:var(--bad);font-size:12px;margin-top:10px;min-height:16px}
  .modal .foot{margin-top:16px;padding-top:13px;border-top:1px solid var(--bd);
               font-size:12px;color:#57606a;line-height:1.7}
  /* 口令"小眼睛"（与客户端同一套）：只切 input.type，值不动 */
  .modal .pwdwrap{position:relative;display:block;margin-top:5px}
  .modal .pwdwrap input.field{margin-top:0;padding-right:40px}
  .modal .pwdwrap .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);
                       width:28px;height:28px;display:flex;align-items:center;justify-content:center;
                       background:none;border:0;border-radius:6px;padding:0;cursor:pointer;
                       color:#8a929c;opacity:.85}
  .modal .pwdwrap .eye:hover{background:#f1f4f8;color:#3d444d}
  .modal .pwdwrap .eye.on{color:var(--pri);opacity:1}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="brand-mark">问</div>
    <div><h1>管理端</h1></div>
  </div>
  <div class="spacer"></div>
  <span id="admin_identity" class="muted">身份加载中…</span>
  <a href="/" target="_blank" style="font-size:13px">客户端</a>
  <a href="/docs" target="_blank" style="font-size:13px">接口文档</a>
</header>

<!-- 登录 / 改密弹层（与客户端同一套；内容由脚本填充） -->
<div id="login_modal" class="modal" style="display:none"></div>

<div class="layout">
  <nav class="side" id="nav">
    <div class="grp">资产（F5）</div>
    <button data-p="metric" class="on">指标目录与编辑</button>
    <button data-p="versions">版本留痕</button>
    <button data-p="onto">本体总览</button>
    <button data-p="pmap">物理映射 ★</button>
    <div class="grp">治理（F5）</div>
    <button data-p="caliber">口径规则与分组</button>
    <button data-p="reconcile">口径对账 ★</button>
    <div class="grp">权限（F6）</div>
    <button data-p="grants">授权台账 ★</button>
    <button data-p="localusers">本地账号 ★</button>
    <button data-p="perm">角色与审计</button>
    <div class="grp">平台（F8）</div>
    <button data-p="llm">模型服务</button>
    <button data-p="ds">数据源</button>
    <button data-p="cleanup">测试数据清理 ★</button>
    <div class="grp">运营（F7）</div>
    <button data-p="ops">运维与时效</button>
  </nav>
  <main id="panel"><div class="card">加载中…</div></main>
</div>

<script>
let CFG = null;
let SESS = null;            // /api/security/session
let ADMIN_UID = null;       // 演示模式下当前身份；生产模式为 null（不自报身份）
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function envLock(key){ return (CFG && CFG.env_overridden || []).includes(key); }
function lockAttr(key){ return envLock(key) ? 'disabled' : ''; }
function envTag(key){ return envLock(key) ? ' <span class="badge b-warn">已被环境变量接管</span>' : ''; }

document.getElementById('nav').onclick = e => {
  const b = e.target.closest('button'); if(!b) return;
  document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on', x===b));
  show(b.dataset.p);
};

async function jget(p){ return (await fetch(p)).json(); }
async function jsend(p, method, body){
  const r = await fetch(p, {method:method, headers:{'Content-Type':'application/json'},
    body: body===undefined?undefined:JSON.stringify(body)});
  return r.json();
}
// 身份：demo 模式才把 user_id 交给服务端；生产模式由网关注入（12 §2 红线 4）
function uq(path, params){
  const q = new URLSearchParams();
  if (ADMIN_UID) q.set('user_id', ADMIN_UID);
  for (const [k, v] of Object.entries(params || {})) if (v) q.set(k, v);
  const s = q.toString();
  return path + (s ? (path.includes('?') ? '&' : '?') + s : '');
}
function withAdmin(body){ if (ADMIN_UID) body.user_id = ADMIN_UID; return body; }
async function jpostU(path, body){
  const r = await fetch(uq(path), {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(withAdmin(body || {}))});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.detail || ('HTTP ' + r.status));
  return d;
}
function operator(){ return ADMIN_UID || 'gateway'; }
function tsText(ts){
  return ts ? new Date(ts * 1000).toLocaleString() : '-';
}

// ── 模型服务 ──
async function showLlm(){
  const p = document.getElementById('panel');
  CFG = await jget(uq('/api/admin/config'));
  const m = CFG.config.llm || {};
  const over = envLock('llm.base_url');
  p.innerHTML = `<div class="card"><h3>模型服务</h3>
    <div class="bar">
      <span>配置状态：${(m.base_url && m.api_key)?'已配置':'未配置'}</span>
      <span>地址：${esc(m.base_url||'-')}</span>
      <span>模型：${esc(m.model||'-')}</span>
      <span>超时：${esc(m.timeout||60)}s</span>
    </div>
    ${(m.base_url && m.api_key) ? '' :
      '<div class="warn"><b>未配置模型</b>：问数走<b>规则匹配降级</b>（用语义层中文别名做最长匹配），只覆盖常见问法；一句多指标、复杂表达会落空。</div>'}
    <label>服务地址 base_url${envTag('llm.base_url')}</label>
    <input id="llm_base_url" value="${esc(m.base_url||'')}" placeholder="http://院内模型服务/v1" ${lockAttr('llm.base_url')}>
    <label>API Key${envTag('llm.api_key')}</label>
    <input id="llm_api_key" type="password" value="" placeholder="${m.api_key?'已配置（留空则不修改）':'未配置'}" ${lockAttr('llm.api_key')}>
    <label>模型名${envTag('llm.model')}</label>
    <input id="llm_model" value="${esc(m.model||'')}" placeholder="qwen2.5-72b-instruct" ${lockAttr('llm.model')}>
    <label>超时（秒）${envTag('llm.timeout')}</label>
    <input id="llm_timeout" value="${esc(m.timeout||60)}" ${lockAttr('llm.timeout')}>
    <div class="row">
      <button class="primary" onclick="saveLlm()">保存并生效</button>
      <button onclick="testLlm()">测试连通</button>
    </div>
    <div id="llm_msg"></div>
    <div class="muted" style="margin-top:8px">配置文件：${esc(CFG.config_path)}｜环境变量优先级更高，被接管的项在此处只读。</div>
  </div>`;
}

async function saveLlm(){
  const body = {
    base_url: document.getElementById('llm_base_url').value.trim(),
    api_key:  document.getElementById('llm_api_key').value,
    model:    document.getElementById('llm_model').value.trim(),
    timeout:  parseInt(document.getElementById('llm_timeout').value||'60',10)
  };
  const d = await jsend(uq('/api/admin/config/llm'),'PUT',withAdmin(body));
  if (d.detail) { document.getElementById('llm_msg').innerHTML =
    `<div class="warn">保存失败：${esc(d.detail)}</div>`; return; }
  document.getElementById('llm_msg').innerHTML =
    `<div class="ok">已保存并生效；重建管线。生效项：${(d.applied||[]).join('、')||'无'}</div>`;
  setTimeout(showLlm, 600);
}
async function testLlm(){
  const d = await jsend(uq('/api/admin/config/llm/test'),'POST',withAdmin({
    base_url: document.getElementById('llm_base_url').value.trim(),
    api_key:  document.getElementById('llm_api_key').value,
    model:    document.getElementById('llm_model').value.trim()
  }));
  document.getElementById('llm_msg').innerHTML = d.ok
    ? `<div class="ok">连通正常（${esc(d.url)}）｜模型回包：${esc(d.reply||'(空)')}</div>`
    : `<div class="warn">连通失败：${esc(d.error)}<div class="muted">请求地址：${esc(d.url||'-')}</div></div>`;
}

// ── 数据源 ──
async function showDs(){
  const p = document.getElementById('panel');
  CFG = await jget(uq('/api/admin/config'));
  const ds = CFG.config.datasource || {};
  const his = ds.his || {}, ads = ds.ads || {};
  p.innerHTML = `<div class="card"><h3>数据源</h3>
    <div class="bar"><span>当前生效：<b>${esc(CFG.active_source)}</b></span>
      <span>his = 直连 HIS 镜像（Oracle）</span><span>ads = 本地宽表（SQLite）</span></div>
    <label>启用数据源${envTag('datasource.active')}</label>
    <select id="ds_active" ${lockAttr('datasource.active')}>
      <option value="his" ${ds.active==='his'?'selected':''}>his —— 直连 HIS 镜像</option>
      <option value="ads" ${ds.active==='ads'?'selected':''}>ads —— 本地宽表</option>
    </select>

    <h3 style="margin-top:16px">HIS 连接</h3>
    <label>主机${envTag('datasource.his.host')}</label>
    <input id="his_host" value="${esc(his.host||'')}" placeholder="10.1.33.46" ${lockAttr('datasource.his.host')}>
    <label>端口${envTag('datasource.his.port')}</label>
    <input id="his_port" value="${esc(his.port||1521)}" ${lockAttr('datasource.his.port')}>
    <label>服务名${envTag('datasource.his.service')}</label>
    <input id="his_service" value="${esc(his.service||'')}" placeholder="oracle10" ${lockAttr('datasource.his.service')}>
    <label>用户名${envTag('datasource.his.user')}</label>
    <input id="his_user" value="${esc(his.user||'')}" placeholder="只读账号" ${lockAttr('datasource.his.user')}>
    <label>密码${envTag('datasource.his.password')}</label>
    <input id="his_password" type="password" value="" placeholder="${his.password?'已配置（留空则不修改）':'未配置'}" ${lockAttr('datasource.his.password')}>

    <h3 style="margin-top:16px">本地宽表（ADS）</h3>
    <label>数据库文件路径${envTag('datasource.ads.path')}</label>
    <input id="ads_path" value="${esc(ads.path||'')}" placeholder="var/ads.db" ${lockAttr('datasource.ads.path')}>

    <div class="row">
      <label class="inline" style="display:inline-flex;align-items:center;gap:6px;margin:0">
        <input type="checkbox" id="ds_confirm" class="inline" style="width:auto">
        我确认切换数据源（会改变所有问数的结果口径）
      </label>
      <button class="primary" onclick="saveDs()">保存并重连</button>
      <button onclick="testDs()">测试连通</button>
      <button onclick="resetDs()">清空运行时配置</button>
    </div>
    <div id="ds_msg"></div>
    <div class="warn">数据源只读：HIS 侧会话级 <code>SET TRANSACTION READ ONLY</code>，且写操作/DDL 关键字在执行前被拦截。<br>
      <b>切换数据源需要二次确认</b>（服务端强校验）：his = 直连镜像、ads = 本地宽表，
      两者不是同一份数据，口径会随之一变。</div>
  </div>`;
}

async function saveDs(){
  const body = {
    active: document.getElementById('ds_active').value,
    his: {host:document.getElementById('his_host').value.trim(),
         port:parseInt(document.getElementById('his_port').value||'1521',10),
         service:document.getElementById('his_service').value.trim(),
         user:document.getElementById('his_user').value.trim(),
         password:document.getElementById('his_password').value},
    ads: {path:document.getElementById('ads_path').value.trim()}
  };
  const box = document.getElementById('ds_confirm');
  if (!box || !box.checked) {
    document.getElementById('ds_msg').innerHTML =
      '<div class="warn">请先勾选「我确认切换数据源」：这一步防的不是攻击者，而是手滑 —— 口径悄悄换了、界面看着一切正常，是最难查的事故。</div>';
    return;
  }
  body.confirm = '我确认切换数据源';
  const d = await jsend(uq('/api/admin/config/datasource'),'PUT',withAdmin(body));
  if (d.detail) { document.getElementById('ds_msg').innerHTML =
    `<div class="warn">保存失败：${esc(d.detail)}</div>`; return; }
  document.getElementById('ds_msg').innerHTML =
    `<div class="ok">已保存，连接已重建。生效项：${(d.applied||[]).join('、')||'无'}｜当前数据源：<b>${esc(d.active_source)}</b></div>`;
}
async function testDs(){
  const d = await jsend(uq('/api/admin/config/datasource/test'),'POST',withAdmin({
    active: document.getElementById('ds_active').value,
    ads: {path: document.getElementById('ads_path').value.trim()}
  }));
  document.getElementById('ds_msg').innerHTML = d.ok
    ? `<div class="ok">连通正常：${esc(d.active)}｜${d.active==='ads'? ('行数 '+d.rows+'，方言 '+d.dialect) : (esc(d.user||'')+' @ '+esc(d.dsn||''))}</div>`
    : `<div class="warn">连通失败：${esc(d.error)}</div>`;
}
async function resetDs(){
  const d = await jsend(uq('/api/admin/config/reset'),'POST',withAdmin({}));
  document.getElementById('ds_msg').innerHTML = d.detail
    ? `<div class="warn">失败：${esc(d.detail)}</div>`
    : `<div class="ok">已清空运行时配置，回落到环境变量/默认值。</div>`;
  setTimeout(showDs, 500);
}

// ── 指标目录与编辑（F5.1 / F5.2 / F5.6）──
let METRICS = [];
let CUR = null;          // 正在编辑的指标（含只读字段）
let OPTS = {};           // 该指标可声明的口径可选值（来自 measure）

async function showMetrics(){
  const p = document.getElementById('panel');
  const kw = (document.getElementById('m_kw')||{}).value || '';
  const dom = (document.getElementById('m_dom')||{}).value || '';
  const d = await jget(uq('/api/semantic/metrics', {keyword: kw, domain: dom}));
  METRICS = d.metrics || [];
  const domains = [...new Set([...METRICS.map(m => m.domain).filter(Boolean)])].sort();
  const types = [...new Set([...METRICS.map(m => m.type).filter(Boolean)])].sort();
  window.MDOMS = domains; window.MTYPES = types;
  p.innerHTML = `<div class="card"><h3>指标目录</h3>
    <div class="muted">口径是人工资产：每个指标必须有<b>一个</b>说了算的责任人；变更留痕；有争议先下线，不硬撑。</div>
    <div class="row">
      <input id="m_kw" class="inline" style="max-width:240px" placeholder="按编码 / 名称 / 别名搜" value="${esc(kw)}">
      <select id="m_dom" class="inline" style="max-width:180px">
        <option value="">全部域</option>
        ${domains.map(x => `<option value="${esc(x)}" ${x === dom ? 'selected' : ''}>${esc(x)}</option>`).join('')}
      </select>
      <button onclick="showMetrics()">筛选</button>
      <button class="primary" onclick="editMetric('')">＋ 新增指标</button>
    </div>
    <div class="bar"><span>共 ${d.count} 个</span><span>语义层版本 ${esc(d.registry_version || '-')}</span>
      <span>${METRICS.filter(m => !m.owner).length} 个未指定责任人</span></div>
    <table><tr><th>编码</th><th>名称</th><th>域 / 类型</th><th>敏感级</th><th>责任人</th><th>状态</th><th>默认口径</th><th>操作</th></tr>
    ${METRICS.map(m => `<tr>
      <td>${esc(m.code)}</td>
      <td>${esc(m.name)}<div class="muted">${esc((m.alias||[]).slice(0,4).join('、'))}</div></td>
      <td>${esc(m.domain || '-')}<div class="muted">${esc(m.type || '-')}</div></td>

// 敏感级不是"填个标签"：这里把三级的可见性后果写在旁边（03 §2.0），
// 因为 12 §1.2 S9 的坑就是"执行层与目录层对 internal 的理解不一致"。
function sensTag(s){
  const map = {public: 'b-ok', internal: 'b-warn', restricted: 'b-bad'};
  const label = {public: '公开', internal: '院内', restricted: '受限'};
  return `<span class="badge ${map[s] || 'b-off'}">${label[s] || esc(s || '-')}</span>`;
}
function sensExplain(s){
  const t = {
    public: '任何登录用户都能问、能看（如"出院人次"的总量）。',
    internal: '需要角色授权（<code>visible_metrics</code>）；未授权角色在指标目录里看不到它。',
    restricted: '受限指标：能看的人**也不能**据此下钻到个人（维度授权独立判定），且默认不出患者级明细。'
  };
  return t[s] || '（未设置敏感级）';
}
function editMetric(code){
  if (!code) {
    CUR = {code:'', name:'', definition:'', formula:'', domain:(window.MDOMS||[])[0] || '',
           type:(window.MTYPES||[])[0] || 'count', alias:[], sensitivity:'public',
           status:'online', owner:'', supported_date_basis:[], supported_dept_basis:[]};
    OPTS = {};
    renderEditor(true);
    return;
  }
  // 返回 Promise：调用方（onclick 或验收脚本）都能等渲染完成
  return jget(uq('/api/semantic/metrics/' + encodeURIComponent(code))).then(d => {
    CUR = d.metric || {};
    OPTS = {date: d.supported_date_basis || [], dept: d.supported_dept_basis || []};
    CUR._versions = (d.versions || []).length;
    renderEditor(false);
  });
}

async function saveMetric(isNew){
  const msg = document.getElementById('editor_msg');
  const val = id => (document.getElementById(id) || {}).value || '';
  const aliases = val('mal').split(/[、,，\s]+/).map(s => s.trim()).filter(Boolean);
  const body = {
    code: val('mc').trim(), name: val('mn').trim(), definition: val('mdef').trim(),
    formula: val('mfor').trim(), domain: val('mdom').trim(), type: val('mtp').trim(),
    alias: aliases, sensitivity: val('msen'), owner: val('mow').trim(),
    status: val('mst'), operator: operator(), change_note: val('mnote'),
  };
  // 口径多选：只在非新建时提交（新建时这些 checkbox 不存在，提交 null = 保持原值）
  if (!isNew) {
    body.supported_date_basis = Array.from(document.querySelectorAll('input[type=checkbox][data-basis=date]:checked')).map(x => x.getAttribute('data-k'));
    body.supported_dept_basis = Array.from(document.querySelectorAll('input[type=checkbox][data-basis=dept]:checked')).map(x => x.getAttribute('data-k'));
  }
  if (!body.code || !body.name) { msg.innerHTML = '<div class="warn">编码与名称必填。</div>'; return; }
  if (!body.owner) {
    // 责任人必填不是"表单校验好看"：没有责任人的指标，口径争议时没人能拍板
    msg.innerHTML = '<div class="warn">必须填写责任人：没有责任人的指标，口径有争议时没人能拍板（后端也会拒）。</div>';
    return;
  }
  try {
    const d = await jpostU('/api/semantic/metrics', body);
    msg.innerHTML = `<div class="ok">已保存（${esc(d.action)}，版本 ${esc(d.version)}）；
      变更字段：${(d.changed||[]).map(esc).join('、') || '无实质变化'}</div>`;
    setTimeout(showMetrics, 800);
  } catch (e) {
    msg.innerHTML = `<div class="warn">保存失败：${esc(e.message)}</div>`;
  }
}
function askRetire(code){
  const box = document.getElementById('editor') || document.getElementById('panel');
  box.insertAdjacentHTML('afterbegin', `<div class="card" id="retire_box"><h3>下线指标 ${esc(code)}</h3>
    <div class="muted">有争议先下线、不硬撑（08 R1）。下线后该指标不再被检索与出数，历史快照不受影响。</div>
    <label>下线原因（必填，会写进版本记录）</label>
    <input id="retire_reason" placeholder="如：与财务口径冲突，待口径确认会拍板">
    <div class="row"><button class="primary" onclick="doRetire('${esc(code)}')">确认下线</button>
      <button onclick="document.getElementById('retire_box').remove()">取消</button></div>
    <div id="retire_msg"></div></div>`);
}
async function doRetire(code){
  const reason = ((document.getElementById('retire_reason')||{}).value || '').trim();
  const msg = document.getElementById('retire_msg');
  if (reason.length < 4) {
    // 后端 RetireRequest.reason 默认空串，会静默写成"下线" —— 界面这里必须拦住
    msg.innerHTML = '<div class="warn">请填写下线原因（至少 4 个字）：原因将来是口径争议的证据。</div>';
    return;
  }
  try {
    const d = await jsend(uq(`/api/semantic/metrics/${encodeURIComponent(code)}/retire`), 'POST',
      withAdmin({operator: operator(), reason: reason}));
    if (d.detail) throw new Error(d.detail);
    msg.innerHTML = `<div class="ok">已下线：${esc(code)}（${esc(d.status)}）</div>`;
    setTimeout(showMetrics, 800);
  } catch (e) {
    msg.innerHTML = `<div class="warn">下线失败：${esc(e.message)}</div>`;
  }
}

// ── 授权台账（F6.2 · docs/12 §4.2）──
//   这一页存在的理由：授权必须**每天都能改得动**。roles.yaml 是代码配置，
//   改一次要走发布流程；而转岗/离职每天都在发生。配置改不动日常，
//   日常就会绕过配置 —— 最后没人说得清"这个人为什么还有权限"。
function scopeText2(v){
  if (v == null) return '未启用';
  if (!v.length) return '无授权';
  return v.includes('*') ? '全院' : v.join('、');
}
function remainText(ts){
  if (!ts) return '长期（需定期复核）';
  const d = Math.floor((ts - Date.now()/1000) / 86400);
  if (d < 0) return '已过期';
  if (d <= 14) return `<span class="badge b-warn">${d} 天后到期</span>`;
  return `${d} 天后到期`;
}

async function runCleanup(){
  const box = document.getElementById('clr_msg');
  const scopes = Array.from(document.querySelectorAll('[data-clr]'))
    .filter(x => x.checked).map(x => x.dataset.clr);
  const phrase = ((document.getElementById('clr_confirm') || {}).value || '').trim();
  if (!scopes.length) {
    if (box) box.innerHTML = '<div class="warn">请至少选择一个分组。</div>';
    return;
  }
  if (phrase !== CLR_PHRASE) {
    if (box) box.innerHTML = `<div class="warn">确认短语不一致：请手打「${esc(CLR_PHRASE)}」。
      这一步防的不是攻击者，是手滑 —— 清理不可撤销。</div>`;
    return;
  }
  try{
    const d = await jpostU('/api/admin/maintenance/test-data/clear',
      {scopes: scopes, confirm: CLR_PHRASE});
    const detail = Object.entries(d.cleared || {}).map(([k, v]) =>
      `${esc(k)}: ${Object.entries(v || {}).filter(([kk, vv]) => typeof vv === 'number')
        .map(([kk, vv]) => `${kk}=${vv}`).join('、')}`).join('<br>');
    CLR_FLASH = `<div class="ok"><b>已清理 ${d.total || 0} 条</b>（分组：${esc((d.scopes || []).join('、'))}）
      ${detail ? '<div class="muted" style="margin-top:6px">' + detail + '</div>' : ''}
      <div class="muted">清理动作已经写入身份事件留痕。</div></div>`;
  }catch(e){
    CLR_FLASH = `<div class="warn">清理失败：${esc(String(e.message || e))}</div>`;
  }
  showCleanup();
}

  const d = await jsend(uq('/api/admin/physical-map'),'PUT',
    withAdmin({text, confirm:PM.confirm, note:'管理端编辑'}));
  if(d.detail){
    pmMsg(`<div class="warn">保存失败：${esc(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail))}</div>`);

  const r = d.reload || {};
  pmMsg(r.ok? `<div class="ok">已保存并热加载生效（版本 ${esc(r.version||'-')}）。</div>`
             : `<div class="warn">已写入，但热加载失败：${esc(r.error||'')}。建议回滚。</div>`);
  if(r.ok) setTimeout(showPhysicalMap, 700);
}

}

function renderAdminIdentity(){
  const node = document.getElementById('admin_identity');
  if (!node) return;
  const u = (SESS || {}).user || {};
  if ((SESS || {}).auth_mode !== 'demo') {
    // 只显示"当前是谁、能不能管"，不写实现说明（那是文档的事）
    if (!u.user_id) { node.innerHTML = ''; return; }
    const role = (!u.role || u.role === 'guest') ? '未授权' : u.role;
    node.innerHTML = `<span class="muted">${esc(u.name || u.user_id)} · ${esc(role)}</span>
      <span class="badge ${u.is_admin ? 'b-ok' : 'b-bad'}">${u.is_admin ? '可管理' : '无管理权限'}</span>`;
    return;
  }
  const accounts = ((SESS || {}).demo_accounts || []).slice();
  // 下拉必须能显示**当前生效**身份（默认是 guest，不在演示账号清单里）
  if (u.user_id && !accounts.some(a => a.user_id === u.user_id)) {
    accounts.unshift({user_id: u.user_id, name: u.name || '', role: u.role,
                      role_name: '未授权身份',
                      _label: '未授权身份（仅最小权限，不能进管理端）'});
  }
  node.innerHTML = `<label class="inline" style="display:inline">演示身份
    <select id="admin_uid" class="inline" style="width:auto" onchange="switchAdminUid()">
      ${accounts.map(a => `<option value="${esc(a.user_id)}" ${a.user_id === (u.user_id || '') ? 'selected' : ''}>
        ${esc(a._label || (a.user_id + ' ' + (a.name || '') + '（' + (a.role_name || a.role) + '）'))}</option>`).join('')}
    </select></label>
    <span class="badge ${u.is_admin ? 'b-ok' : 'b-bad'}">${u.is_admin ? '可管理' : '无管理权限'}</span>`;
}
// ── 登录 / 改密弹层（F6.1 · docs/12 §3.6）──
// 管理端也能登录：两边用的是**同一个**服务端会话（同一 Cookie 域），
// 在哪登录效果一样，不存在"两套凭证"。登录后可改口径的会话本就是同一个。
async function jpostRaw(path, body){
  const r = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json'},
                               body: JSON.stringify(body || {})});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.detail || ('HTTP ' + r.status));
  return d;
}

// ── 口令框的"小眼睛"（与客户端同一套）──
// 只切 `input.type`：值不动、不复制、不记进任何地方。
const EYE_SVG = `<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
  stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <path d="M1.8 12S5.8 5.8 12 5.8 22.2 12 22.2 12 18.2 18.2 12 18.2 1.8 12 1.8 12z"/>
  <circle cx="12" cy="12" r="3.1"/></svg>`;

function pwdInput(id, opts){
  const o = opts || {};
  // aria-label 显式给输入框：小眼睛在 <label> 里，不声明的话读屏会把控件名念成
  // 「口令 显示口令」（按钮的 aria-label 被并进 label 文本）。
  const al = o.al ? ` aria-label="${esc(o.al)}"` : '';
  return `<span class="pwdwrap"><input id="${id}" class="field" type="password"${al}
      autocomplete="${esc(o.ac || 'current-password')}" placeholder="${esc(o.ph || '')}"
      ><button type="button" class="eye" title="显示口令" aria-label="显示口令"
      onclick="togglePwd('${id}', this)">${EYE_SVG}</button></span>`;
}

function togglePwd(id, btn){
  const i = document.getElementById(id);
  if (!i) return;
  const show = i.type === 'password';
  i.type = show ? 'text' : 'password';
  if (btn){
    if (btn.classList) btn.classList.toggle('on', show);
    btn.title = show ? '隐藏口令' : '显示口令';
    if (btn.setAttribute) btn.setAttribute('aria-label', btn.title);
  }
}

function showLoginModal(){
  const m = document.getElementById('login_modal');
  if (!m) return;
  const ll = (SESS || {}).local_login || {};
  const bs = (SESS || {}).bootstrap || {};
  // 系统内还没有账号：直接给「创建管理员」，登录框在这里没有任何用处
  if (bs.needs_bootstrap) {
    m.innerHTML = `
    <div class="box">
      <div class="brandrow">
        <div class="logo">问</div>
        <div>
          <h2>创建管理员账号</h2>
          <div class="sub">系统内还没有任何账号</div>
        </div>
      </div>
      <label class="field">工号
        <input id="bs_uid" class="field" autocomplete="username" placeholder="工号 / 账号">
      </label>
      <label class="field">姓名
        <input id="bs_name" class="field" placeholder="真实姓名">
      </label>
      <label class="field">口令
        ${pwdInput('bs_pwd', {al: '口令', ac: 'new-password',
          ph: `至少 ${bs.pwd_min_len || ll.pwd_min_len || 8} 位，不能包含工号`})}
      </label>
      <label class="field">再输一次
        ${pwdInput('bs_pwd2', {al: '再输一次', ac: 'new-password'})}
      </label>
      <div class="actions"><button class="btn-main" onclick="doAdminBootstrap()">创建并登录</button></div>
      <div class="msg" id="bs_msg"></div>
      <div class="foot">
        该账号会直接获得 <b>${esc(bs.admin_role || '信息科')}</b> 角色（<code>roles.yaml</code> 里
        带 <code>admin: true</code> 的角色）与全院数据范围，并写入授权台账；建成后此入口自动关闭。
      </div>
    </div>`;
    m.style.display = 'flex';
    const f = document.getElementById('bs_uid');
    if (f && f.focus) { try { f.focus(); } catch (e) {} }
    return;
  }
  m.innerHTML = `
    <div class="box">
      <div class="brandrow">
        <div class="logo">问</div>
        <div>
          <h2>登录管理端</h2>
          <div class="sub">与问数客户端共用同一个会话</div>
        </div>
      </div>
      ${ll.enabled ? `
        <label class="field">工号
          <input id="al_uid" class="field" autocomplete="username" placeholder="工号 / 账号">
        </label>
        <label class="field">口令
          ${pwdInput('al_pwd', {al: '口令', ph: `至少 ${ll.pwd_min_len || 8} 位`})}
        </label>
        <div class="actions"><button class="btn-main" onclick="doAdminLogin()">登录</button></div>
        <div class="msg" id="al_msg"></div>
        <div class="foot">
          能进管理端由<b>授权台账</b>里的角色决定（需要 <code>admin: true</code>，即信息科）；
          普通账号可以登录，但只会看到「无管理端权限」。
        </div>` : `
        <div class="danger">当前未开启本地登录（<code>ASK_AUTH_LOCAL=off</code>），
          院内统一认证也尚未接通 —— 请联系信息科配置登录方式。</div>`}
    </div>`;
  m.style.display = 'flex';
  const f = document.getElementById('al_uid');
  if (f && f.focus) { try { f.focus(); } catch (e) {} }
}

async function doAdminBootstrap(){
  const val = id => ((document.getElementById(id) || {}).value || '');
  const msg = document.getElementById('bs_msg');
  if (msg) msg.textContent = '';
  const uid = val('bs_uid').trim();
  const name = val('bs_name').trim();
  const p1 = val('bs_pwd'), p2 = val('bs_pwd2');
  if (!uid || !name) { if (msg) msg.textContent = '工号与姓名都要填'; return; }
  if (p1 !== p2) { if (msg) msg.textContent = '两次输入的口令不一致'; return; }
  try{
    await jpostRaw('/api/security/bootstrap/admin',
                   {user_id: uid, name: name, password: p1, password2: p2});
    location.reload();
  }catch(e){ if (msg) msg.textContent = String(e.message || e); }
}

async function doAdminLogin(){
  const uid = ((document.getElementById('al_uid') || {}).value || '').trim();
  const pwd = (document.getElementById('al_pwd') || {}).value || '';
  const msg = document.getElementById('al_msg');
  if (msg) msg.textContent = '';
  if (!uid || !pwd) { if (msg) msg.textContent = '工号与口令都要填'; return; }
  try{
    const d = await jpostRaw('/api/security/auth/local/login', {user_id: uid, password: pwd});
    if (d.must_change) {
      // 重新拉一次会话：改密期间顶部要能显示"是谁、待改口令"，不能是空白
      try { SESS = await jget('/api/security/session'); } catch (e) {}
      showPwdChange();
      return;
    }
    location.reload();
  }catch(e){ if (msg) msg.textContent = String(e.message || e); }
}

function showPwdChange(){
  const m = document.getElementById('login_modal');
  if (!m) return;
  const ll = (SESS || {}).local_login || {};
  const idn = document.getElementById('admin_identity');
  if (idn) {
    const u = (SESS || {}).user || {};
    const role = (!u.role || u.role === 'guest') ? '未授权' : u.role;
    idn.innerHTML = `<span class="badge b-warn">待改口令</span>
      <span class="muted">${esc(u.name || u.user_id || '')} · ${esc(role)}</span>
      <a href="#" onclick="doAdminLogout();return false;" style="font-size:13px">退出</a>`;
  }
  m.innerHTML = `
    <div class="box">
      <div class="brandrow">
        <div class="logo">问</div>
        <div>
          <h2>设置新口令</h2>
          <div class="sub">首次登录必须换掉初始口令</div>
        </div>
      </div>
      <label class="field">初始口令
        ${pwdInput('ap_old', {al: '初始口令'})}
      </label>
      <label class="field">新口令
        ${pwdInput('ap_new', {al: '新口令', ac: 'new-password', ph: `至少 ${ll.pwd_min_len || 8} 位`})}
      </label>
      <label class="field">再输一次
        ${pwdInput('ap_new2', {al: '再输一次', ac: 'new-password'})}
      </label>
      <div class="actions"><button class="btn-main" onclick="doAdminPwdChange()">设置新口令</button></div>
      <div class="msg" id="ap_msg"></div>
      <div class="foot">
        不能与工号相同，不能复用最近 3 次用过的口令。<br>
        改完之后管理员也无从得知你的口令。
      </div>
      <div class="foot"><a href="#" onclick="doAdminLogout();return false;">退出登录</a></div>
    </div>`;
  m.style.display = 'flex';
}

async function doAdminPwdChange(){
  const oldp = (document.getElementById('ap_old') || {}).value || '';
  const n1 = (document.getElementById('ap_new') || {}).value || '';
  const n2 = (document.getElementById('ap_new2') || {}).value || '';
  const msg = document.getElementById('ap_msg');
  if (msg) msg.textContent = '';
  if (n1 !== n2) { if (msg) msg.textContent = '两次输入的新口令不一致'; return; }
  try{
    await jpostRaw('/api/security/auth/local/password/change',
                   {old_password: oldp, new_password: n1});
    location.reload();
  }catch(e){ if (msg) msg.textContent = String(e.message || e); }
}

async function doAdminLogout(){
  try { await jpostRaw('/api/security/logout', {}); } catch (e) {}
  location.reload();
}

function gatePanel(){
  const u = (SESS || {}).user || {};
  if (u.is_admin) return false;
  // ★「未登录」与「登录了但没权限」是两件事：混成一张卡片，会让人以为"账号没权限"，
  //   实际只是还没登录 —— 这两种失败该做的事完全不同（去登录 vs 找管理员要授权）。
  if ((SESS || {}).need_login || ((SESS || {}).bootstrap || {}).needs_bootstrap) {
    const boot = ((SESS || {}).bootstrap || {}).needs_bootstrap;
    showLoginModal();
    document.getElementById('panel').innerHTML = `<div class="card">
      <h3>${boot ? '系统还没有账号' : '需要先登录'}</h3>
      <div class="warn">${boot
        ? '账号表是空的：先创建第一个管理员账号（表单已弹出），建成后本页自动刷新。'
        : `当前没有有效会话（<code>${esc((SESS || {}).auth_mode || '')}</code> 模式）。
           请在登录框中输入工号与口令；登录后本页会自动刷新。`}</div>
      <div class="muted" style="margin-top:8px">
        登录只证明「你是谁」；能不能进管理端由<b>授权台账</b>里的角色决定
        （需要 <code>admin: true</code>，即信息科）。
      </div></div>`;
    return true;
  }
  document.getElementById('panel').innerHTML = `<div class="card">
    <h3>无管理端权限</h3>
    <div class="warn"><b>${esc(u.name || '当前身份')}（${esc(!u.role || u.role === 'guest' ? '未授权' : u.role)}）不能进入管理端。</b>
      管理端能改数据源、口径规则与指标定义，属于运维/信息科职责（12 §3.4）。</div>
    <div class="kv" style="margin-top:10px">
      <b>需要什么</b><span>角色里带 <code>admin: true</code>（演示环境可用「演示身份」切换到 <code>u005</code> 信息科）</span>
      <b>这一步能挡住谁</b><span>挡住误入与手滑。<b>真正的边界在网关</b>：本页是静态文件，
        前端门禁不是安全边界 —— 生产必须由 <code>/admin</code> 前置代理校验身份（12 §3.4）</span>
    </div>
    <div class="row"><a href="/">→ 去问数客户端</a></div></div>`;
  return true;
}
async function switchAdminUid(){
  ADMIN_UID = document.getElementById('admin_uid').value;
  SESS = {auth_mode: 'demo', user: await jget('/api/security/me?user_id=' + encodeURIComponent(ADMIN_UID)),
          demo_accounts: (SESS || {}).demo_accounts || []};
  renderAdminIdentity();
  if (gatePanel()) return;
  const on = document.querySelector('#nav button.on');
  show(on ? on.dataset.p : 'metric');
}
async function bootAdmin(){
  try {
    SESS = await jget('/api/security/session');
  } catch (e) {
    document.getElementById('panel').innerHTML =
      `<div class="card"><div class="warn">会话获取失败：${esc(String(e.message || e))}</div></div>`;
    return;
  }
  if (SESS.auth_mode === 'demo' && ((SESS.user || {}).user_id)) {
    ADMIN_UID = SESS.user.user_id;   // 默认 guest = 最小权限；要管理就显式切换
  }
  renderAdminIdentity();
  if (gatePanel()) return;
  show('metric');
}
bootAdmin();
</script>
