<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>医院智能问数</title>
<style>
  :root{--bd:#e3e6ea;--pri:#1a5fb4;--ok:#1a7f37;--warn:#9a6700;--bad:#b42318;--bg:#f6f8fa;
        --stale:#b42318;--restated:#b8500f;--unknown:#57606a}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.6 "Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:#1f2328;
       font-variant-numeric:tabular-nums}
  header{background:#fff;border-bottom:1px solid var(--bd);padding:10px 18px;display:flex;gap:16px;
         align-items:center;position:sticky;top:0;z-index:5}
  header h1{font-size:16px;margin:0;color:var(--pri)}
  .spacer{flex:1}
  select,input,button,textarea{font:inherit}
  button{padding:8px 14px;border:1px solid var(--bd);background:#fff;border-radius:6px;cursor:pointer}
  button.primary{background:var(--pri);color:#fff;border-color:var(--pri)}
  button:hover{opacity:.9}
  button:disabled{opacity:.5;cursor:default}
  /* ── 三栏：会话/历史 · 对话 · 口径与证据（docs/13 §3.1）── */
  .layout{display:grid;grid-template-columns:230px minmax(0,1fr) 300px;gap:14px;
          max-width:1500px;margin:14px auto;padding:0 16px;align-items:start}
  @media (max-width:1150px){.layout{grid-template-columns:200px minmax(0,1fr)}
                            .drawer{grid-column:1 / -1}}
  .card{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:14px;margin-bottom:14px}
  .rail .card,.drawer .card{padding:10px;margin-bottom:10px}
  .askbar{display:flex;gap:8px}
  .askbar input{flex:1;padding:10px;border:1px solid var(--bd);border-radius:6px}
  .chips span{display:inline-block;background:#eef2f7;border:1px solid var(--bd);
    border-radius:14px;padding:3px 10px;margin:3px 6px 3px 0;cursor:pointer;font-size:13px}
  .chips span:hover{background:#e8f0fb}
  .bar{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
  .bar span{background:#f0f4f9;border:1px solid var(--bd);border-radius:4px;padding:2px 8px;font-size:12px}
  .bar span[title]{cursor:help}
  .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;border:1px solid}
  .b-settled{color:var(--ok);border-color:var(--ok);background:#e9f7ee}
  .b-provisional{color:var(--warn);border-color:var(--warn);background:#fff8e6}
  .b-source_stale{color:var(--bad);border-color:var(--bad);background:#fdeceb}
  .b-restated{color:var(--restated);border-color:var(--restated);background:#fff2e8}
  .b-other{color:var(--unknown);border-color:var(--unknown);background:#f0f0f0}
  .b-deny{color:var(--bad);border-color:var(--bad);background:#fdeceb}
  .b-scope{color:var(--warn);border-color:var(--warn);background:#fff8e6}
  .b-ask{color:var(--pri);border-color:var(--pri);background:#e8f0fb}
  .b-empty{color:var(--unknown);border-color:var(--unknown);background:#f0f0f0}
  .b-err{color:var(--bad);border-color:var(--bad);background:#fdeceb}
  table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}
  th,td{border:1px solid var(--bd);padding:5px 8px;text-align:left}
  th{background:#f6f8fa}
  .muted{color:var(--unknown);font-size:12px}
  .warn{background:#fff8e6;border:1px solid #f0d98a;padding:6px 10px;border-radius:6px;margin-top:8px;font-size:13px}
  .danger{background:#fdeceb;border:1px solid #f0a9a2;padding:6px 10px;border-radius:6px;margin-top:8px;font-size:13px}
  .info{background:#e8f0fb;border:1px solid #a9c8f0;padding:6px 10px;border-radius:6px;margin-top:8px;font-size:13px}
  .fb{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .fb button{font-size:12px;padding:4px 10px}
  pre{background:#f6f8fa;border:1px solid var(--bd);padding:8px;overflow:auto;font-size:12px;max-height:220px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
  .metric{border:1px solid var(--bd);border-radius:6px;padding:10px;background:#fff}
  .metric b{display:block;margin-bottom:4px}
  .stale{color:var(--bad)}
  /* ── 状态卡：六种状态一眼可区分（docs/13 §3.3）── */
  .card.state-answered{border-left:4px solid var(--pri)}
  .card.state-meta{border-left:4px solid #8250df}
  .card.state-need_clarify{border-left:4px solid var(--pri);background:#fbfdff}
  .card.state-denied{border-left:4px solid var(--bad)}
  .card.state-out_of_scope{border-left:4px solid var(--warn)}
  .card.state-empty{border-left:4px solid var(--unknown)}
  .card.state-error{border-left:4px solid var(--bad);background:#fffbfb}
  .card.state-stale{filter:saturate(.55)}
  .askitem{border:1px solid var(--bd);border-radius:6px;padding:10px;margin-top:10px;background:#fff}
  .asksel{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
  .asksel label{border:1px solid var(--bd);border-radius:16px;padding:4px 12px;cursor:pointer;font-size:13px}
  .asksel label:hover{background:#f0f4f9}
  .asksel label.off{opacity:.6;border-style:dashed;cursor:help}
  .asksel input{margin-right:6px}
  /* ── F3 分析视图 ── */
  .actpanel{border:1px solid var(--bd);border-radius:6px;padding:10px;margin-top:8px;background:#fbfdff}
  .actpanel select,.actpanel input[type=number]{padding:4px 6px;border:1px solid var(--bd);border-radius:4px}
  svg.chart{width:100%;height:150px;display:block;margin-top:8px;background:#fff;border:1px solid var(--bd);border-radius:6px}
  .barlist{margin-top:8px}
  .barrow{display:grid;grid-template-columns:130px 1fr 90px;gap:8px;align-items:center;font-size:13px;margin:3px 0}
  .barbg{background:#eef2f7;border-radius:3px;height:14px;position:relative}
  .barfg{background:var(--pri);height:14px;border-radius:3px}
  .barrow .num{text-align:right;font-variant-numeric:tabular-nums}
  .abar{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;border:1px solid #a9c8f0;background:#e8f0fb;color:var(--pri)}
  .big{font-size:15px;font-weight:600}
  .kv{display:grid;grid-template-columns:120px 1fr;gap:4px 10px;font-size:13px;margin-top:6px}
  .kv b{font-weight:600;color:var(--unknown)}
  /* ── 对话流 ── */
  #stream{min-height:200px}
  .turn{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
  .bubble{max-width:78%;padding:8px 12px;border-radius:10px;white-space:pre-wrap}
  .bubble.me{align-self:flex-end;background:#e8f0fb;border:1px solid #a9c8f0}
  .bubble.ai{align-self:flex-start;width:100%;max-width:100%;padding:0;background:none;border:none}
  .bubble.ai .card{margin-bottom:0}
  .turnnote{font-size:12px;color:var(--unknown)}
  /* ── 左栏 / 右栏 ── */
  .rail,.drawer{position:sticky;top:64px}
  .sess{display:block;width:100%;text-align:left;padding:6px 8px;margin:2px 0;font-size:13px;
        border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sess.on{border-color:var(--pri);background:#e8f0fb;font-weight:600}
  .panel-title{font-weight:600;margin-bottom:6px}
  .overlay{position:fixed;inset:0;background:rgba(31,35,40,.35);display:flex;justify-content:center;
           padding:40px 16px;z-index:20;overflow:auto}
  .overlay .sheet{background:#fff;border-radius:10px;max-width:1100px;width:100%;padding:16px;height:fit-content}
  .skeleton{height:12px;background:#eef2f7;border-radius:6px;margin:6px 0}
  /* ── 顶部身份区：品牌块 + 双行标题（原来是蓝色大标题 + 一排等权按钮，像内部工具）── */
  header .brand{display:flex;align-items:center;gap:10px;flex:0 0 auto}
  header .brand-mark{width:30px;height:30px;border-radius:8px;background:var(--pri);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700}
  header h1{font-size:15px;margin:0;color:#1f2328;font-weight:600;line-height:1.25}
  header .navbtn{font-size:13px;padding:7px 12px;border-radius:7px;background:#fff}
  header .navbtn:hover{border-color:#c9d2dc;background:#fafbfc}
  .card{box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .askbar input{background:#fbfcfd}
  .askbar input:focus{outline:none;border-color:var(--pri);background:#fff;
                      box-shadow:0 0 0 3px rgba(26,95,180,.10)}
  /* ── 登录 / 改密弹层 ──
     为什么不复用 .overlay：那是口径抽屉，点击遮罩会关闭；登录弹层不能这样关，
     否则用户点一下空白就回到"什么都没有"的状态，会以为页面坏了。 */
  .modal{position:fixed;inset:0;background:rgba(23,28,35,.45);display:flex;align-items:center;
         justify-content:center;z-index:50;padding:20px;overflow:auto}
  .modal .box{background:#fff;border-radius:12px;width:100%;max-width:400px;padding:26px;
              box-shadow:0 18px 48px rgba(16,24,40,.20);height:fit-content}
  .modal .brandrow{display:flex;align-items:center;gap:11px;margin-bottom:18px}
  .modal .logo{width:36px;height:36px;border-radius:9px;background:var(--pri);color:#fff;
               display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700}
  .modal h2{margin:0;font-size:17px;line-height:1.3;font-weight:600}
  .modal .sub{font-size:12px;color:var(--unknown);margin-top:1px}
  .modal label.field{display:block;font-size:12px;color:var(--unknown);margin-top:14px}
  .modal input.field{width:100%;padding:10px 11px;margin-top:5px;border:1px solid var(--bd);
                     border-radius:7px;background:#fbfcfd;font-size:14px}
  .modal input.field:focus{outline:none;border-color:var(--pri);background:#fff;
                           box-shadow:0 0 0 3px rgba(26,95,180,.12)}
  .modal .actions{display:flex;align-items:center;gap:10px;margin-top:18px}
  .modal .btn-main{flex:1;background:var(--pri);color:#fff;border-color:var(--pri);
                   padding:10px 16px;border-radius:7px;font-weight:600}
  .modal .btn-main:hover{opacity:.94}
  .modal .msg{color:var(--bad);font-size:12px;margin-top:10px;min-height:16px}
  .modal .foot{margin-top:16px;padding-top:13px;border-top:1px solid var(--bd);
               font-size:12px;color:var(--unknown);line-height:1.7}
  .modal .foot b{color:#3d444d;font-weight:600}
  /* 口令"小眼睛"：只切换 input 的 type，不复制/不记录口令。
     输入框的 margin-top 挪到包裹层上，否则按钮的垂直居中会偏 2~3px。 */
  .modal .pwdwrap{position:relative;display:block;margin-top:5px}
  .modal .pwdwrap input.field{margin-top:0;padding-right:40px}
  .modal .pwdwrap .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);
                       width:28px;height:28px;display:flex;align-items:center;justify-content:center;
                       background:none;border:0;border-radius:6px;padding:0;cursor:pointer;
                       color:#8a929c;opacity:.85}
  .modal .pwdwrap .eye:hover{background:#f1f4f8;color:#3d444d}
  .modal .pwdwrap .eye.on{color:var(--pri);opacity:1}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="brand-mark">问</div>
    <div>
      <h1>医院智能问数</h1>
    </div>
  </div>
  <button class="navbtn" id="btnnew" onclick="newSession()">＋ 新会话</button>
  <button class="navbtn" onclick="tab('dash')">我的驾驶舱</button>
  <button class="navbtn" onclick="tab('metric')">指标口径说明</button>
  <div class="spacer"></div>
  <div id="identity" class="muted">身份加载中…</div>
 
</header>

<!-- 登录 / 改密弹层（内容由脚本按状态填充；不用 document.createElement，
     这样 Node 端的界面验收脚本也能用同一套 mock 跑通） -->
<div id="login_modal" class="modal" style="display:none"></div>

<div class="layout">
  <!-- 左栏：会话与我的快照（docs/13 §3.1：F2.5 可回溯 + 12 §6.3 限本人） -->
  <aside class="rail">
    <div class="card">
      <div class="panel-title">对话</div>
      <div id="sessions"><div class="muted">加载中…</div></div>
    </div>
    <div class="card">
      <div class="panel-title">我的快照</div>
      <div id="mysnaps"><div class="muted">加载中…</div></div>
      <div class="muted">快照不可变：历史答案可复现，口径变更不会改写它。</div>
    </div>
  </aside>

  <!-- 中栏：对话流（常驻问句框 + 追问建议） -->
  <section class="chat">
    <div class="card" style="position:sticky;top:60px;z-index:4">
      <div class="askbar">
        <input id="q" placeholder="例如：上个月全院出院人次是多少" />
        <button class="primary" id="askbtn" onclick="ask()">提问</button>
      </div>
      <div class="chips" id="chips"></div>
      <div class="muted" id="sidline"></div>
    </div>
    <!-- 左栏「我的快照」的落点：历史快照没有归属轮次，不能塞进某张卡片的证据区（docs/13 §3.1） -->
    <div id="snapdetail"></div>
    <div id="stream"></div>
    <!-- 供 scripts/check_ui_states.js 抽取契约用：render(d) 默认写入 #result -->
    <div id="result" hidden></div>
  </section>

  <!-- 右栏：口径回显与切换（F2.1/F2.2） + 证据与反馈（F2.5/F7.1） -->
  <aside class="drawer">
    <div class="card">
      <div class="panel-title">口径</div>
      <div id="caliber"><div class="muted">问一个问题后，这里常驻显示这次的统计口径。</div></div>
    </div>
    <div class="card">
      <div class="panel-title">我的口径偏好</div>
      <div id="prefs"><div class="muted">尚未记住任何口径。</div></div>
    </div>
  </aside>
</div>

<div id="overlay" class="overlay" style="display:none" onclick="if(event.target===this)closeOverlay()">
  <div class="sheet">
    <div style="display:flex;align-items:center;gap:10px">
      <div class="panel-title" id="overlay-title" style="margin:0"></div>
      <div class="spacer"></div>
      <button onclick="closeOverlay()">关闭</button>
    </div>
    <div id="panel"></div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────────────────────
// 客户端 = 对话（docs/13 §3）：一次问数 = 一轮；每轮有独立的卡片、证据与动作。
// 状态（P0：身份来自服务端；多轮上文只在本会话内传递，见 docs/13 §7 C12）
// ─────────────────────────────────────────────────────────────
let SESSION = null;    // /api/security/session 的返回
let CUR_UID = null;    // 仅 demo 模式下有值；生产模式为 null（不向服务端自报身份）
let AUTH_ERROR = '';   // SSO 回调失败原因（服务端跳回 /?auth_error=…，见 renderIdentity）
let SID = null;        // 当前会话 ID（F1.9）。空 = 还没建会话，第一问时由服务端建
let LAST = null;       // 最近一次回答（分析动作的兜底基准）
let PENDING = null;    // 待提交的反问项
let ANALYSIS = null;   // 当前结果卡是哪个分析动作产出的（{kind,label,note}）
let SEQ = 0;           // 对话流轮次序号
let ANSWERS = {};      // answer_id → 该轮的回答（分析动作要用它自己的 DSL，不能用全局 LAST）

// 浏览器判定：Node 端（scripts/check_ui_states.js）只跑渲染，不碰网络与真实 DOM
const IN_BROWSER = (typeof window !== 'undefined' && typeof document !== 'undefined'
                    && !!document.body);

const esc = s => (s == null ? '' : String(s)).replace(/[&<>"]/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const el = id => document.getElementById(id);

async function jget(p) {
  const r = await fetch(p);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.detail || ('HTTP ' + r.status));
  return d;
}
async function jpost(p, body) {
  const r = await fetch(p, { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(d.detail || ('HTTP ' + r.status)), { payload: d });
  return d;
}
// 只在 demo 模式下把身份交给服务端；生产模式一律不带（docs/12 §2 红线 4）
function withUser(body) { if (CUR_UID) body.user_id = CUR_UID; return body; }
function withQuery(url) { return CUR_UID ? url + (url.includes('?') ? '&' : '?') + 'user_id=' + encodeURIComponent(CUR_UID) : url; }

// ─────────────────────────────────────────────────────────────
// 身份条（不再由前端自选身份决定授权）
// ─────────────────────────────────────────────────────────────
function scopeText(scope) {
  if (!Array.isArray(scope) || !scope.length) return '无数据范围';
  if (scope.includes('*')) return '全院';
  return '范围 ' + scope.join('、');
}
// 界面上不出现 guest 这个内部兜底码：对用户来说它只有一个意思 ——「未授权」。
// （兜底本身不能删：未知用户必须有最小权限，否则会变成"报错"或更糟的"放行"。）
function roleLabel(r){ return (!r || r === 'guest') ? '未授权' : r; }
function renderIdentity() {
  const node = el('identity');
  if (!node) return;
  const d = SESSION || {};
  // 生产模式（gateway / sso）：身份不由前端决定，只显示服务端解析出的主体。
  // ★ 未登录时**必须给出口**：只说"未登录"等于让用户卡在首页猜怎么进去。
  if (d.auth_mode !== 'demo') {
    const u = d.user || {};
    const bs = d.bootstrap || {};
    if (d.need_login || !u.user_id) {
      const lc = d.login_config || {};
      const ll = d.local_login || {};
      // 顶部只留一个入口按钮：登录表单在弹层里（挤在导航条里实测没人看得见）
      // ★ 没有任何账号时给的是「创建管理员账号」而不是「登录」：
      //   一个空系统上没有可登录的账号，显示登录框等于让人去猜自己账号是什么。
      node.innerHTML = bs.needs_bootstrap ? `
        <span class="badge b-warn">未初始化</span>
        <button class="primary" style="font-size:13px;padding:6px 16px" onclick="showLoginModal()">创建管理员账号</button>
        <span class="muted">系统内还没有任何账号</span>` : `
        <span class="badge b-other">未登录</span>
        ${ll.enabled
          ? '<button class="primary" style="font-size:13px;padding:6px 16px" onclick="showLoginModal()">登录</button>'
          : ''}
        ${d.login_url
          ? `<a href="${esc(d.login_url)}" style="font-size:13px;text-decoration:none">用院内账号登录</a>` : ''}
        ${(!ll.enabled && !d.login_url)
          ? `<span class="muted">登录入口未配置${(lc.missing || []).length ? '（缺 ' + esc((lc.missing || []).join('、')) + '）' : ''}</span>`
          : ''}`;
      disableAsk(bs.needs_bootstrap ? '系统还没有账号，请先创建管理员账号' : '未登录，无法提问');
      return;
    }
    node.innerHTML = `<span class="badge ${(!u.role || u.role === 'guest') ? 'b-other' : 'b-settled'}">${esc(roleLabel(u.role))}</span>
      <span class="muted">${esc(u.name || u.user_id || '')} · ${esc(scopeText(u.dept_scope))}</span>
      ${u.can_view_sql ? '<span class="muted">· 可看 SQL</span>' : ''}
      ${d.login_url ? '<a class="btn" href="#" onclick="doLogout();return false;">登出</a>' : ''}
      ${d.note ? `<div class="muted">${esc(d.note)}</div>` : ''}`;
    return;
  }
  const u = d.user || {};
  const warn = u.role === 'guest' || !(u.dept_scope || []).length;
  const accounts = (d.demo_accounts || []).slice();
  // ★ 下拉框必须能显示**当前生效**的身份：默认身份是 guest（服务端最保守），
  //   它不在演示账号清单里。若直接渲染清单，浏览器会默认选中第一个账号（u001 院长），
  //   而实际授权仍是 guest —— 身份条就在骗人。
  if (u.user_id && !accounts.some(a => a.user_id === u.user_id)) {
    accounts.unshift({ user_id: u.user_id, name: u.name || '',
                       role: u.role, role_name: '未授权身份',
                       _label: '未授权身份（仅最小权限，看不到数据）' });
  }
  node.innerHTML = `
    <label>演示身份
      <select id="uid" onchange="onUidChange()">

async function doLocalLoginFrom(uidId, pwdId, msgId) {

  const pwd = (el(pwdId) || {}).value || '';
  const msg = el(msgId);
  if (msg) msg.textContent = '';
  if (!uid || !pwd) { if (msg) msg.textContent = '工号与口令都要填'; return; }

const EYE_SVG = `<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
  stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <path d="M1.8 12S5.8 5.8 12 5.8 22.2 12 22.2 12 18.2 18.2 12 18.2 1.8 12 1.8 12z"/>

function pwdInput(id, opts) {
  const o = opts || {};
  // aria-label 显式给输入框：小眼睛按钮在 <label> 里，不显式声明的话
  // 读屏会把控件名念成「口令 显示口令」（按钮的 aria-label 被并进 label 文本）。
  const al = o.al ? ` aria-label="${esc(o.al)}"` : '';
  return `<span class="pwdwrap"><input id="${id}" class="field" type="password"${al}
      autocomplete="${esc(o.ac || 'current-password')}" placeholder="${esc(o.ph || '')}"
      ><button type="button" class="eye" title="显示口令" aria-label="显示口令"
      onclick="togglePwd('${id}', this)">${EYE_SVG}</button></span>`;
}

function togglePwd(id, btn) {
  const i = el(id);
  if (!i) return;
  const show = i.type === 'password';
  i.type = show ? 'text' : 'password';
  if (btn) {
    if (btn.classList) btn.classList.toggle('on', show);
    btn.title = show ? '隐藏口令' : '显示口令';
    if (btn.setAttribute) btn.setAttribute('aria-label', btn.title);
  }
}

// ─────────────────────────────────────────────────────────────
// 对话流：一轮 = 一个问句气泡 + 一个答案容器
//   turnShell() 是纯函数（可被 Node 端直接断言），addTurn() 负责挂载。
// ─────────────────────────────────────────────────────────────
function turnAnsId(n) { return 'ans-' + n; }
function turnShell(n, question, badge, note) {
  return `<div class="turn" id="turn-${n}">
    <div class="bubble me">${esc(question)}
      ${badge ? `<span class="badge b-ask">${esc(badge)}</span>` : ''}</div>
    ${note ? `<div class="turnnote">${esc(note)}</div>` : ''}
    <div class="bubble ai" id="${turnAnsId(n)}"><div class="card">查询中…</div></div>
  </div>`;
}
function addTurn(question, badge, note) {
  SEQ += 1;
  const stream = el('stream');
  if (stream) {
    stream.insertAdjacentHTML('beforeend', turnShell(SEQ, question, badge, note));
    // 只保留最近 30 轮：DOM 无限增长会让长会话越来越卡
    while (stream.children.length > 30) stream.removeChild(stream.firstElementChild);
  }
  scrollBottom();
  return turnAnsId(SEQ);
}
function scrollBottom() {
  if (IN_BROWSER && typeof window.scrollTo === 'function') {
    window.scrollTo(0, document.body.scrollHeight);
  }
}
// 空态引导（F1.7）：没问过任何问题时，告诉用户能问什么
function renderOnboarding(examples) {
  const stream = el('stream');
  if (!stream || stream.children.length) return;
  stream.innerHTML = `<div class="card"><b>还没有对话</b>
    <div class="muted">用自然语言问一个指标，系统会先确认口径、再出数；每个数字都能追溯到口径、SQL 与快照。</div>
    <div class="chips">${(examples || []).map(x =>
      `<span onclick="ask(${JSON.stringify(x.question).replace(/"/g, '&quot;')})">${esc(x.question)}</span>`).join('')}</div>
    <div class="muted">左边是您的历史会话与快照，右边常驻这次的口径与证据。</div>
  </div>`;
}

// 未登录时把提问入口关掉：留着它，用户会先打一整顿问题、再吃一个 401 ——
// "能问但不给答"比"一开始就说清要登录"差得多（docs/13 空态即引导）。
function disableAsk(why) {
  if (!IN_BROWSER) return;
  const q = el('q'), btn = el('askbtn');
  if (q) { q.disabled = true; q.placeholder = why; }
  if (btn) { btn.disabled = true; }
}

// ─────────────────────────────────────────────────────────────
// 提问（F1.1/F1.2）：带上当前 session_id，服务端据此把上一轮口径作为上文
// ─────────────────────────────────────────────────────────────
async function ask(override, opts) {
  opts = opts || {};
  const input = el('q');
  const q = (override != null ? override : (input ? input.value : '')).trim();
  if (!q) return;
  if (override == null && input) input.value = q;
  const btn = el('askbtn');
  if (btn) btn.disabled = true;
  // 第一问落地时清掉空态引导（它只是一段说明，不属于任何一轮）
  if (IN_BROWSER && opts.newTurn !== false && SEQ === 0) {
    const s = el('stream');
    if (s) s.innerHTML = '';
  }

  const target = (IN_BROWSER && opts.newTurn !== false)
    ? addTurn(q, opts.badge, opts.note) : opts.target;
  if (target) {
    const node = el(target);
    if (node) node.innerHTML = '<div class="card">查询中…（召回 → 生成 → 校验 → 执行）</div>';
  }

  const body = withUser({ question: q });
  if (SID) body.session_id = SID;
  if (opts.resolved) body.resolved = opts.resolved;
  if (opts.dsl) body.dsl = opts.dsl;
  if (opts.followUp === false) body.follow_up = false;
  try {
    const d = await jpost('/api/ask', body);
    SID = d.session_id || SID;
    ANALYSIS = null;
    PENDING = null;
    render(d, target);
    if (IN_BROWSER) { loadSessions(); renderSidLine(d); }
  } catch (e) {
    if (target && el(target)) el(target).innerHTML = renderError(String(e.message || e));
  } finally {
    if (btn) btn.disabled = false;
  }
}
function renderSidLine(d) {
  const node = el('sidline');
  if (!node) return;
  node.textContent = d.session_id
    ? `会话 ${d.session_id}${d.context_used ? ' · 已沿用上文口径' : ''}`
    : '';
}
// 反问卡提交（F1.3）：同一轮内替换卡片 —— 上一张卡还没有任何数字，不算覆盖答案
async function submitClarify(useDefault) {
  if (!LAST) return;
  const resolved = {};
  for (const item of (PENDING || [])) {
    const sel = document.querySelector(`input[name="amb-${CSS.escape(item.id)}"]:checked`);
    const val = useDefault ? (item.default || '') : (sel ? sel.value : '');
    if (val) resolved[item.id] = val;
  }
  if (!Object.keys(resolved).length) {
    panelMsg('ev-' + aidOf(LAST), '请先选择一个口径，或使用「按默认口径出数」。');
    return;
  }
  // ★ 只提交 resolved：口径由语义层声明（ambiguity_rules.yaml 的 apply 段）写回 DSL。
  //   target 用**反问卡所在的那一轮**：历史轮次里的反问卡也必须在原地更新。
  await ask(LAST.question, { resolved: resolved, newTurn: false, target: PENDING_TARGET });
}

function pickSeries(rows) {

  const dots = s.vals.map((v, i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="2.5" fill="#1a5fb4"/>`).join('');
  const mark = [0, Math.floor((s.labs.length - 1) / 2), s.labs.length - 1]
    .filter((i, k, a) => a.indexOf(i) === k)
    .map(i => `<text x="${X(i).toFixed(1)}" y="${H - 8}" font-size="10" text-anchor="middle" fill="#57606a">${esc(String(s.labs[i]).slice(-6))}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">
      <polyline points="${pts}" fill="none" stroke="#1a5fb4" stroke-width="2"/>${dots}${mark}
      <text x="${pad}" y="14" font-size="11" fill="#57606a">最高 ${fmtNum(mx)}</text>
      <text x="${W - pad}" y="14" font-size="11" text-anchor="end" fill="#57606a">最低 ${fmtNum(mn)}</text>
      <text x="${pad}" y="${Math.max(24, Y(s.vals[0]) - 6)}" font-size="11" fill="#1a5fb4">${esc(s.valKey)}</text>

      <div title="${esc(String(r[s.labKey]))}">${esc(String(r[s.labKey]))}</div>
      <div class="barbg"><div class="barfg" style="width:${(vals[i] / mx * 100).toFixed(1)}%"></div></div>

  const cur = {
    date_basis: (d && d.dsl && d.dsl.time && d.dsl.time.date_basis) || '',
    dept_basis: (d && d.dsl && d.dsl.options && d.dsl.options.dept_basis) || '',
  };
  box.innerHTML = `
    <div class="bar">${bar.length ? bar.map(b =>
      `<span title="来源：${esc(b.source || '语义层')}">${esc(b.key)}：${esc(b.value)}</span>`).join('')
      : '<span class="muted">本次没有口径可回显（如被拒绝或超范围的请求）</span>'}</div>
    <div class="muted">成熟度 ${esc(t.maturity || '-')} · 数据截止 ${esc(t.data_as_of || '未探测')} · 指纹 ${esc(t.result_hash || '-')}</div>
    <div id="switchable">${code ? '<div class="muted">口径可切换项加载中…</div>'
      : '<div class="muted">出数之后才能切换口径。</div>'}</div>
    <div class="muted" id="curcal">${cur.date_basis || cur.dept_basis
      ? `当前：${esc(cur.date_basis || '默认时间口径')} · ${esc(cur.dept_basis || '默认科室口径')}` : ''}</div>`;
  if (IN_BROWSER && code && d.answer_id) loadSwitchables(code, d.answer_id, cur);
}
let SW_TOKEN = 0;
async function loadSwitchables(metricCode, answerId, cur) {
  const box = el('switchable');
  if (!box) return;
  const token = ++SW_TOKEN;      // 用户连着问两句时，旧请求不许覆盖新一轮的口径区
  try {
    const d = await jget(withQuery('/api/semantic/metrics/' + encodeURIComponent(metricCode)));
    if (token !== SW_TOKEN || !el('switchable')) return;
    const mm = d.metric || {};
    const db = d.supported_date_basis || mm.supported_date_basis || [];
    const kb = d.supported_dept_basis || mm.supported_dept_basis || [];
    // 当前值：DSL 没写明时用语义层默认口径（不是"第一项"，否则回显会撒谎）
    if (!cur.date_basis) cur.date_basis = mm.default_date_basis || '';
    if (!cur.dept_basis) cur.dept_basis = mm.default_dept_basis || '';
    if (!db.length && !kb.length) {
      box.innerHTML = '<div class="muted">该指标未声明可切换口径。</div>';
      return;
    }
    const opt = (arr, sel) => arr.map(v =>
      `<option value="${esc(v)}" ${v === sel ? 'selected' : ''}>${esc(v)}</option>`).join('');
    box.innerHTML = `
      ${db.length ? `<div style="margin-top:8px">时间口径
        <select id="sw-date">${opt(db, cur.date_basis)}</select></div>` : ''}
      ${kb.length ? `<div style="margin-top:6px">科室口径
        <select id="sw-dept">${opt(kb, cur.dept_basis)}</select></div>` : ''}
      <label class="muted" style="display:block;margin-top:6px">
        <input type="checkbox" id="sw-remember"> 记住我的选择</label>
      <div class="fb"><button class="primary" onclick="applyCaliber('${esc(answerId)}')">按新口径重算</button></div>
      <div class="muted">切换口径会生成${IN_BROWSER ? '一张新卡片' : '新结果'}，原卡片与快照保留（快照不可变）。</div>`;
  } catch (e) {
    box.innerHTML = `<div class="muted">口径可选项目读取失败：${esc(String(e.message || e))}</div>`;
  }
}
async function applyCaliber(answerId) {
  const base = ANSWERS[answerId] || LAST;
  if (!base || !base.dsl) return;
  const dsl = JSON.parse(JSON.stringify(base.dsl));
  const dateSel = el('sw-date');
  const deptSel = el('sw-dept');
  if (dateSel && dateSel.value) dsl.time = Object.assign({}, dsl.time, { date_basis: dateSel.value });
  if (deptSel && deptSel.value) dsl.options = Object.assign({}, dsl.options, { dept_basis: deptSel.value });
  const remember = el('sw-remember') && el('sw-remember').checked;
  const metric = (dsl.metrics || [])[0] || base.metric_code;
  const pickedCaliber = [dateSel && dateSel.value, deptSel && deptSel.value]
    .filter(Boolean).join(' · ');
  if (remember) {
    // 偏好按**指标码**分 scope 存（app/core/meta_db.py::get_prefs_all 的理由）：
    // 口径可选值是按指标判定的，跨指标沿用会直接踩到"口径用不了"。
    const items = [];
    if (dateSel && dateSel.value) items.push(['date_basis', dateSel.value]);
    if (deptSel && deptSel.value) items.push(['dept_basis', deptSel.value]);
    for (const [k, v] of items) {
      try {
        await jpost('/api/trust/pref', withUser({ scope: metric, key: k, value: v }));
      } catch (e) { /* 偏好写失败不影响出数 */ }
    }
    loadPrefs();
  }
  // 问句原样不变：口径由 DSL 注入（inject_dsl），不靠改问句来表达
  await ask(base.question, { dsl: dsl, badge: '按新口径重算' + (pickedCaliber ? '：' + pickedCaliber : ''),
    note: '口径切换不改写原答案：上一张卡片与快照仍可查。' });
}
async function loadPrefs() {
  const box = el('prefs');
  if (!box || !IN_BROWSER || !CUR_UID) return;
  try {
    const d = await jget('/api/trust/prefs/' + encodeURIComponent(CUR_UID));
    const scopes = Object.keys((d && d.prefs) || {});
    if (!scopes.length) {
      box.innerHTML = '<div class="muted">尚未记住任何口径。</div>';
      return;
    }
    box.innerHTML = scopes.map(sc => `
      <div style="font-size:12px;margin-bottom:4px"><b>${esc(sc)}</b>
        ${Object.keys(d.prefs[sc]).map(k => `
          <div style="display:flex;gap:6px;align-items:center">
            <span>${esc(k)}：${esc(d.prefs[sc][k])}</span>
            <div class="spacer" style="flex:1"></div>
            <button style="padding:2px 6px" onclick="delPref('${esc(sc)}', '${esc(k)}')">清除</button>
          </div>`).join('')}
      </div>`).join('');
  } catch (e) { box.innerHTML = '<div class="muted">偏好读取失败。</div>'; }
}
async function delPref(scope, key) {
  try {
    await fetch(withQuery(`/api/trust/pref/${encodeURIComponent(CUR_UID)}/${encodeURIComponent(scope)}/${encodeURIComponent(key)}`), { method: 'DELETE' });
    loadPrefs();
  } catch (e) { /* 忽略 */ }
}

// ─────────────────────────────────────────────────────────────
// 证据区：快照 / 复现 / 导出（挂在**该轮**卡片上，不覆盖其他轮）
// ─────────────────────────────────────────────────────────────
async function showSnapshot(id, aid) {
  // 落点分两种来源，以前不分：一律去找"当前轮次"的证据框 ev-<answer_id>，
  // 于是从左栏点历史快照时 —— 页面刚打开（LAST 为空）会回退成不存在的 ev-t0，
  // 命中 `if (!box) return` 变成静默没反应；已经问过一轮则把旧快照画到**最新那一轮**下面。
  //   ① 结果卡里的「查看快照」：aid = 该轮 answer_id → 落在那一轮的证据区 ev-<aid>
  //   ② 左栏「我的快照」历史列表：没有归属轮次 → 落在中栏顶部的 #snapdetail
  //      （卡内证据区因 30 轮裁剪而消失时，同样回退到这里，不再静默失败）
  const inline = aid ? el('ev-' + aid) : null;
  const box = inline || el('snapdetail');
  if (!box) { alert('页面缺少快照展示位置（#snapdetail）'); return; }
  box.innerHTML = '<div class="info">快照读取中…</div>';
  try {
    const d = await jget(withQuery('/api/trust/snapshot/' + encodeURIComponent(id)));
    box.innerHTML = `<div class="info"><b>口径快照</b>
      <div class="muted">${esc(d.question || '')} · 指标版本 ${esc(d.metric_ver || '-')} · 成熟度 ${esc(d.maturity || '-')} · 数据截至 ${esc(d.data_as_of || '-')}</div>
      <pre>${esc(typeof d.caliber_json === 'string' ? d.caliber_json : JSON.stringify(d.caliber_json, null, 2))}</pre>
      <div class="muted">该快照不可变：历史答案可复现，口径变更不会改写它。</div>
      ${inline ? '' : '<div class="fb"><button onclick="el(\'snapdetail\').innerHTML=\'\'">收起</button></div>'}
    </div>`;
  } catch (e) { box.innerHTML = `<div class="warn">快照读取失败：${esc(String(e.message || e))}</div>`; }
}
async function replay(id, aid) {
  const box = el('ev-' + (aid || aidOf(LAST || {})));
  if (!box) return;
  try {
    const d = await jpost(withQuery('/api/trust/replay/' + encodeURIComponent(id)), {});
    box.innerHTML = d.replayed
      ? `<div class="${d.identical ? 'info' : 'warn'}"><b>复现结果：</b>${d.identical ? '与当时逐位一致' : '存在差异' +
          (d.difference_notes ? '：' + esc((d.difference_notes || []).join('；')) : '')}</div>`
      : `<div class="warn">复现失败：${esc(d.error || '未知')}</div>`;
  } catch (e) { box.innerHTML = `<div class="warn">复现失败：${esc(String(e.message || e))}</div>`; }
}
let EXPORT_READY = null;
async function prepareExport(id, aid) {
  const box = el('ev-' + (aid || aidOf(LAST || {})));
  if (!box) return;
  try {
    const d = await jpost('/api/reports/export', withUser({ answer_id: id, fmt: 'csv' }));
    EXPORT_READY = d;
    box.innerHTML = `<div class="info"><b>导出预览（水印随文件携带，禁止外传）</b>
      <pre>${esc(d.watermark || '(无水印)')}</pre>
      <div class="muted">共 ${d.row_count} 行 · 内容由服务端按快照 <code>${esc(id)}</code> 取，不接受前端提交的数据。</div>
      <div class="fb"><button class="primary" onclick="doDownload()">确认下载 CSV</button></div></div>`;
  } catch (e) { box.innerHTML = `<div class="warn">导出失败：${esc(String(e.message || e))}</div>`; }
}
function doDownload() {
  if (!EXPORT_READY) return;
  const blob = new Blob(['\ufeff' + EXPORT_READY.content], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '问数导出_' + ((LAST && LAST.answer_id) || '') + '.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

// ─────────────────────────────────────────────────────────────
// 反馈（F7.1/F7.2）
// ─────────────────────────────────────────────────────────────
async function fb(kind, aid) {
  const base = ANSWERS[aid] || LAST;
  if (!base) return;
  const box = el('ev-' + (aid || aidOf(base)));
  try {
    const d = await jpost('/api/ops/feedback', withUser({ answer_id: base.answer_id, kind: kind, question: base.question }));
    if (box) box.innerHTML = `<div class="info">已记录反馈${d.backlogged ? '，该问题已进回流队列（将作为 Golden 集标注候选）' : ''}。反馈编号 ${esc(d.feedback_id || '-')}</div>`;
  } catch (e) { if (box) box.innerHTML = `<div class="warn">反馈提交失败：${esc(String(e.message || e))}</div>`; }
}

// ─────────────────────────────────────────────────────────────
// 左栏：会话历史（F1.9）与我的快照（F2.5）
// ─────────────────────────────────────────────────────────────
function newSession(reload) {
  SID = null; SEQ = 0; LAST = null; PENDING = null; ANALYSIS = null; ANSWERS = {};
  const stream = el('stream');
  if (stream) stream.innerHTML = '';
  const sidline = el('sidline');
  if (sidline) sidline.textContent = '';
  if (IN_BROWSER && reload !== false) { loadSessions(); loadExamples(); }
}
function fmtTime(ts) {
  if (!ts) return '';
  const d = new Date(ts * 1000);
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
// 身份是最小权限时，"没有历史"其实是"看不到历史"——这两句话对用户完全不同。
// demo 下默认身份是 guest（服务端最保守的取值，且它不在演示账号清单里），
// 而会话与快照按人归属（12 §6.3），所以此时左栏必然为空。
// 不说清楚，用户会把"看不到自己的历史"判断成"这个功能坏了"。
function emptyHistoryHint() {
  const u = (SESSION && SESSION.user) || {};
  if (!u.user_id || u.user_id === 'guest' || u.role === 'guest') {
    return '当前是 <b>未授权身份（最小权限）</b>，历史与快照<b>仅本人可见</b>，'
         + '因此这里没有任何记录 —— 请先在顶部身份条切换到自己的账号。';
  }
  return '';
}
async function loadSessions() {
  const box = el('sessions');
  if (!box || !IN_BROWSER) return;
  try {
    const d = await jget(withQuery('/api/chat/sessions'));
    const list = d.sessions || [];
    box.innerHTML = list.length ? list.map(s => `
      <button class="sess ${s.session_id === SID ? 'on' : ''}" onclick="loadThread('${esc(s.session_id)}')"
        title="${esc(s.title || '')}（${s.turn_count} 轮 · 更新于 ${fmtTime(s.updated_at)}）">
        ${esc(s.title || '新会话')}</button>`).join('')
      : `<div class="muted">${emptyHistoryHint() || '还没有会话。问一个问题就会自动建一个。'}</div>`;
  } catch (e) { box.innerHTML = `<div class="muted">会话加载失败：${esc(String(e.message || e))}</div>`; }
}
async function loadThread(sid) {
  const stream = el('stream');
  if (!stream) return;
  stream.innerHTML = '<div class="card">加载会话…</div>';
  try {
    const t = await jget(withQuery('/api/chat/sessions/' + encodeURIComponent(sid)));
    SID = sid; SEQ = 0; ANSWERS = {}; LAST = null;
    stream.innerHTML = '';
    const msgs = t.messages || [];
    let lastQ = '';
    for (const m of msgs) {
      if (m.role === 'user') {
        lastQ = m.question || '';
        continue;
      }
      const p = m.payload;
      if (!p) {                       // 早期消息没有载荷：只显示问句 + 状态
        addTurn(lastQ, null, `这一轮没有留存渲染载荷（${m.status || '未知'}）`);
        continue;
      }
      addTurn(p.question || lastQ, null,
        p.rows_truncated ? `回放仅保留前 ${(p.rows || []).length} 行（共 ${p.row_count} 行）` : null);
      render(p, turnAnsId(SEQ));
    }
    if (!msgs.length) stream.innerHTML = '<div class="card">这个会话还没有内容。</div>';
    const sidline = el('sidline');
    if (sidline) sidline.textContent = `会话 ${sid} · ${t.turn_count || 0} 轮`;
    loadSessions();
  } catch (e) {
    stream.innerHTML = `<div class="card state-error"><div class="danger">会话加载失败：${esc(String(e.message || e))}</div></div>`;
  }
}
async function loadSnapshots() {
  const box = el('mysnaps');
  if (!box || !IN_BROWSER) return;
  try {
    const list = await jget(withQuery('/api/trust/snapshots?limit=20'));
    box.innerHTML = (list || []).length ? list.map(s => `
      <button class="sess" onclick="showSnapshot('${esc(s.answer_id)}', '')"
        title="${esc(s.question || '')}">${esc((s.question || '').slice(0, 14))}
        <span class="muted">${esc(s.maturity || '')}</span></button>`).join('')
      : `<div class="muted">${emptyHistoryHint() || '还没有快照。出过数的问答都会留一份不可变快照。'}</div>`;
  } catch (e) { box.innerHTML = `<div class="muted">快照加载失败：${esc(String(e.message || e))}</div>`; }
}
async function loadExamples() {
  const box = el('chips');
  if (!box || !IN_BROWSER) return;
  try {
    // 冷启动问法；已有会话时给"接下来能问什么"
    const d = await jget('/api/ask/examples');
    const more = SID ? await jget('/api/chat/examples').catch(() => []) : [];
    const all = (d || []).concat(more || []);
    box.innerHTML = all.map(x =>
      `<span onclick="ask(${JSON.stringify(x.question).replace(/"/g, '&quot;')})">${esc(x.question)}</span>`).join('');
  } catch (e) { /* 引导失败不影响提问 */ }
}

// ─────────────────────────────────────────────────────────────
// 浮层：我的驾驶舱（F4.1 简版）/ 指标目录（F1.7）
// ─────────────────────────────────────────────────────────────
function closeOverlay() {
  const o = el('overlay');
  if (o) o.style.display = 'none';
}
async function tab(name) {
  const o = el('overlay');
  const p = el('panel');
  const title = el('overlay-title');
  if (!o || !p) return;
  o.style.display = 'flex';
  p.innerHTML = '<div class="card">加载中…</div>';
  if (title) title.textContent = name === 'dash' ? '我的驾驶舱' : '指标口径说明';
  try {
    if (name === 'dash') {
      const d = await jget(withQuery('/api/reports/dashboard'));
      p.innerHTML = `<div class="card"><b>角色驾驶舱</b>
        <span class="muted">${esc((d.user || {}).name || '-')} · ${esc((d.user || {}).role || '-')} · 指标版本 ${esc(d.registry_version || '-')}</span>
        <div class="grid" style="margin-top:10px">${(d.cards || []).map(c => `<div class="metric">
          <b>${esc(c.name)}</b><div class="muted">${esc(c.code)} · ${esc(c.domain || '-')}</div>
          <div class="muted">${c.last_value_snapshot ? '最近快照 ' + esc(c.last_value_snapshot.maturity || '') + '（数据截至 ' + esc(c.last_value_snapshot.data_as_of || '-') + '）' : '暂无快照'}</div>
          <button style="margin-top:6px" onclick="closeOverlay(); ask(${JSON.stringify(c.name + '是多少').replace(/"/g, '&quot;')})">问这个指标</button>
        </div>`).join('')}</div>
        <div class="muted" style="margin-top:8px">卡面不做实时计算（避免拖垮源库）：点击后用语义层默认口径问一次，口径与证据都在对话流里。</div>
      </div>`;
    }
    if (name === 'metric') {
      const d = await jget(withQuery('/api/semantic/metrics'));
      p.innerHTML = `<div class="card"><b>指标目录</b>
        <span class="muted">共 ${d.count} 个 · 版本 ${esc(d.registry_version || '')}（只显示您有权查看的指标）</span>
        <table><tr><th>编码</th><th>名称</th><th>域</th><th>定义</th><th>责任人</th></tr>
        ${(d.metrics || []).map(m => `<tr><td>${esc(m.code)}</td><td>${esc(m.name)}</td><td>${esc(m.domain)}</td>
          <td>${esc((m.definition || '').slice(0, 60))}</td><td>${esc(m.owner || '未指定')}</td></tr>`).join('')}
        </table></div>`;
    }
  } catch (e) {
    p.innerHTML = `<div class="warn">加载失败：${esc(String(e.message || e))}</div>`;
  }
}

// ─────────────────────────────────────────────────────────────
// 启动
// ─────────────────────────────────────────────────────────────
async function boot() {
  try {
    SESSION = await jget('/api/security/session');
  } catch (e) {
    el('identity').innerHTML =
      `<span class="badge b-err">会话获取失败</span> <span class="muted">${esc(String(e.message || e))}</span>`;
    return;
  }
  if (SESSION.auth_mode === 'demo' && (SESSION.demo_accounts || []).length) {
    CUR_UID = (SESSION.user || {}).user_id || SESSION.demo_accounts[0].user_id;
  }
  // SSO 回调失败时服务端跳回 /?auth_error=…。**读完就把参数从地址栏去掉**：
  // 不清掉的话，用户之后每次刷新都会看到一条早已过期的失败提示。
  if (typeof location !== 'undefined' && location.search) {
    try {
      const err = new URLSearchParams(location.search).get('auth_error');
      if (err) {
        AUTH_ERROR = err;
        if (window.history && history.replaceState) {
          history.replaceState(null, '', location.pathname);
        }
      }
    } catch (e) { /* 老浏览器没有 URLSearchParams：不影响主流程 */ }
  }
  renderIdentity();
  // 本地账号首登：直接进改密，别让用户先打一整顿问题再吃 409
  if (SESSION.must_change) { showPwdChange(); return; }
  // 系统内还没有账号：直接弹「创建管理员账号」（空系统上没有登录这个动作可做）
  if ((SESSION.bootstrap || {}).needs_bootstrap) { showLoginModal(); return; }
  // 未登录：弹登录层（顺带不拉历史 —— 拉回来只会是 401，界面会闪一下错误）
  if (SESSION.need_login) { showLoginModal(); return; }
  if (!IN_BROWSER) return;
  const q = el('q');
  if (q) q.addEventListener('keydown', ev => { if (ev.key === 'Enter') ask(); });
  try {
    const ex = await jget('/api/ask/examples');
    renderOnboarding(ex);
    const box = el('chips');
    if (box) box.innerHTML = (ex || []).map(x =>
      `<span onclick="ask(${JSON.stringify(x.question).replace(/"/g, '&quot;')})">${esc(x.question)}</span>`).join('');
  } catch (e) { /* 引导失败不影响提问 */ }
  loadSessions();
  loadSnapshots();
  loadPrefs();
}
boot();
</script>
