# 角色与数据范围（F6.2 / F6.3）
#
# ⚠️ MVP 示例配置：dept_code 必须与院内科室字典对齐后才能上线。
#    默认策略取**最保守**：未知用户 = guest（无任何科室范围）。

# 院区数据范围（F6.3 · default_campus_scope / campus_scope）三态语义：
#   不写     → 不启用院区围栏（保持升级前行为：SQL 里不注入 campus_code 条件）
#   []       → 显式无授权 → 拒绝出数
#   ["*"]    → 全院区
#   ["01"]   → 限定院区（码值以院内角色/科室字典的 campus_code 为准）
# ★ 为什么"不写"不等于"无授权"：一次升级就把既有账号全拒掉属于重大行为变更，
#   院区码是院方口径（docs/12 §3.5），必须由院里确认后才能在这里收紧。
# ★ 另外：院区维度要能做"问东院却只有西院权限"的**预检**，还得在语义层
#   dimensions[campus].enum_map 里配「院区名 → campus_code」；只配 scope 不配字典时，
#   围栏仍然生效（不会漏数），只是拒绝理由不会提前给出。

roles:
  院长:
    name: 院长 / 副院长
    default_dept_scope: ["*"]
    default_campus_scope: ["*"]
    visible_metrics: "*"
    sensitive_metrics: "*"
    can_export: true
    can_view_sql: false

  医务处:
    name: 医务处
    default_dept_scope: ["*"]
    default_campus_scope: ["*"]
    visible_metrics: "*"
    sensitive_metrics: "*"
    can_export: true
    can_view_sql: false

  运营管理部:
    name: 运营管理部
    default_dept_scope: ["*"]
    default_campus_scope: ["*"]
    visible_metrics: "*"
    can_export: true
    can_view_sql: false

  财务处:
    name: 财务处
    default_dept_scope: ["*"]
    default_campus_scope: ["*"]
    visible_metrics: "*"
    sensitive_metrics: "*"
    can_export: true
    can_view_sql: false

  医保办:
    name: 医保办
    default_dept_scope: ["*"]
    default_campus_scope: ["*"]
    can_export: true
    can_view_sql: false

  科室主任:
    name: 临床科室主任
    default_dept_scope: []        # 按用户逐个授权
    # ★ 这里刻意**不配** default_campus_scope：科室码本身已归属院区，
    #   在院方确认科室字典与院区码的对应关系之前启用院区围栏，
    #   有把"自己科室"挡在外面的风险（表现为主任查自己科室被拒）。
    can_export: true
    can_view_sql: false

  信息科:
    name: 信息科 / 数据 PM
    default_dept_scope: ["*"]
    default_campus_scope: ["*"]
    visible_metrics: "*"
    sensitive_metrics: "*"
    can_export: true
    can_view_sql: true            # 唯一可查看 SQL 的角色
    admin: true                   # 唯一可看他人快照/审计的角色（12 §6.3）

  guest:
    name: 未授权
    default_dept_scope: []
    default_campus_scope: []      # 显式无院区授权（科室层已先拒，保持一致）
    visible_metrics: []
    can_export: false
    can_view_sql: false

users:
  # ⚠️ 示例账号，上线前替换为真实 SSO 主体
  #
  # 院区受限账号怎么写（示例，按需打开并填入院内院区码）：
  #   u0xx:
  #     name: 东院区运营助理
  #     role: 运营管理部
  #     dept_scope: ["0101", "0102"]
  #     campus_scope: ["01"]        # 只能看东院；界面上点"西院"会被预检拒绝
  u001:
    name: 张院长
    role: 院长
  u002:
    name: 心内科王主任
    role: 科室主任
    dept_scope: ["0101"]
  u003:
    name: 医务处李干事
    role: 医务处
  u004:
    name: 财务处赵会计
    role: 财务处
  u005:
    name: 信息科小陈
    role: 信息科
