# 数据源注册表（F8.1）—— 多源接入在「抽取层」，不在「查询层」。
#
# 三条设计原则：
#   1. 本表只登记「可接入的源」。问数引擎永远只面向**单一出数源**（ASK_DS = ads | his）；
#      多源汇聚发生在抽取层（抽取作业 → ADS 宽表），不发生在查询路径上。
#      理由见 docs/11 §5.6：性能（直连 20s vs ADS 52ms）、权限围栏只需实现一次、
#      源之间时效不同步（DRG 停 2019-06、报表层停 2024-10）、方言各异。
#   2. ★ 密钥永不落盘：连接字段只写「环境变量名」，密码一律不写默认值。
#      （对照 docs/12 §1.2 S6：var/runtime_config.yaml 曾把密钥明文落盘）
#      自测会强制校验这一点：python -m app.core.sources --selftest
#   3. 未配置的源必须显式表达为 unconfigured，**不静默跳过、不阻塞其他源**。
#
# conn 字段两种写法：
#   password: ASK_HIS_PASSWORD                     # 只从环境变量取，无默认 → 缺失即该源不可用
#   host: {env: ASK_HIS_HOST, default: 10.1.33.46} # 可取环境变量，可带默认值
#   thick: true                                    # 非字符串字面量直接使用

sources:
  his:
    name: HIS 生产库镜像
    kind: oracle
    layer: extract                 # extract = 抽取来源；serve = 出数源
    enabled: true                  # 已打通（B 路线直连 + A 路线抽取）
    covers: 门诊 / 住院 / 费用 / 手术
    conn:
      host:     {env: ASK_HIS_HOST,    default: 10.1.33.46}
      port:     {env: ASK_HIS_PORT,    default: 1521}
      service:  {env: ASK_HIS_SERVICE, default: oracle10}
      user:     {env: ASK_HIS_USER,    default: his}
      password: ASK_HIS_PASSWORD     # 只读账号，禁用带写权限的应用账号
      thick: true                    # Oracle 11g 必须 thick mode
    note: MVP 首要数据源；100+ schema 散落业务，物理映射见 physical_map_his.yaml

  ads:
    name: 本地 ADS 宽表
    kind: sqlite
    layer: serve                   # 出数源：问数只面向它
    enabled: true
    covers: 多源汇聚后的出数层
    conn:
      path: {env: ASK_ADS, default: var/ads.db}
    note: 生产换 Doris 时语义层零改动；建表 DDL 由 scripts/build_ads.py 产出

  lis:
    name: LIS 检验系统
    kind: oracle
    layer: extract
    enabled: false                 # 未接入 → 探测返回 unconfigured（显式，不静默）
    covers: 检验检查
    conn:
      host:     {env: ASK_LIS_HOST}
      port:     {env: ASK_LIS_PORT, default: 1521}
      service:  {env: ASK_LIS_SERVICE}
      user:     {env: ASK_LIS_USER}
      password: ASK_LIS_PASSWORD
      thick: true
    note: P2 接入；先跑只读盘点（参照 scripts/probe_his.py），再定抽取口径

  emr:
    name: EMR 电子病历
    kind: oracle
    layer: extract
    enabled: false
    covers: 病历文书 / 病案首页
    conn:
      host:     {env: ASK_EMR_HOST}
      port:     {env: ASK_EMR_PORT, default: 1521}
      service:  {env: ASK_EMR_SERVICE}
      user:     {env: ASK_EMR_USER}
      password: ASK_EMR_PASSWORD
    note: P2；病历文本涉及隐私，入库前必须去标识

  insurance:
    name: 医保结算系统
    kind: oracle
    layer: extract
    enabled: false
    covers: 医保结算 / DIP-DRG 分组
    conn:
      host:     {env: ASK_INS_HOST}
      port:     {env: ASK_INS_PORT, default: 1521}
      service:  {env: ASK_INS_SERVICE}
      user:     {env: ASK_INS_USER}
      password: ASK_INS_PASSWORD
    note: P2；DRG 分组器版本变化会引起指标漂移（IN-05 漂移哨兵依赖此源）

  hrp:
    name: HRP 运营管理
    kind: oracle
    layer: extract
    enabled: false
    covers: 人力 / 物资 / 固定资产
    conn:
      host:     {env: ASK_HRP_HOST}
      port:     {env: ASK_HRP_PORT, default: 1521}
      service:  {env: ASK_HRP_SERVICE}
      user:     {env: ASK_HRP_USER}
      password: ASK_HRP_PASSWORD
    note: P3；科室与人员主数据以此为准，用于授权同步（docs/12 §4.2）
