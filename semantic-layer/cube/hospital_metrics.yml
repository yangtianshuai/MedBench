# ============================================================
# Cube.dev 语义层示例（备选方案）
# 说明：Cube 的 ratio 需写成 SQL 表达式度量，
#       务必用 SUM(x)/NULLIF(SUM(y),0)，不要写 AVG。
# ============================================================

cubes:

  # ───────── 门诊就诊 ─────────
  - name: outpatient_visit
    title: 门诊就诊
    sql: >
      SELECT * FROM dwd.dwd_fact_outpatient_visit
      WHERE is_valid_visit = 1

    joins:
      - name: dept
        relationship: many_to_one
        # dept_basis = belong（默认）；切换口径需改 join 条件
        sql: "${CUBE}.belong_dept_code = ${dept}.dept_code"

    measures:
      - name: op_visit_cnt
        title: 门诊人次
        type: sum
        sql: is_valid_visit
        meta:
          alias: [门诊量, 门诊人数, 门急诊量]
          unit: 人次
          date_basis: visit
          dept_basis: belong

      - name: op_patient_cnt
        title: 门诊人数
        type: count_distinct
        sql: patient_id
        meta: {unit: 人, dedup: patients}

      - name: op_revenue
        title: 门诊收入
        type: sum
        sql: total_fee
        format: currency
        meta: {unit: 元, date_basis: settle, sensitivity: restricted}

      - name: op_drug_fee
        title: 门诊药品费用
        type: sum
        sql: drug_fee
        format: currency

      - name: op_avg_fee
        title: 门诊次均费用
        # ★ ratio：先聚合再相除
        type: number
        sql: "SUM(${CUBE}.total_fee) / NULLIF(SUM(${CUBE}.is_valid_visit), 0)"
        format: decimal
        meta: {unit: 元, alias: [次均费用, 门诊人均费用]}

    dimensions:
      # ★ 三个时间口径
      - name: reg_date
        title: 挂号日期
        sql: reg_date
        type: time
        meta: {date_basis: reg}
      - name: visit_date
        title: 就诊日期
        sql: visit_date
        type: time
        meta: {date_basis: visit}
      - name: settle_date
        title: 结算日期
        sql: settle_date
        type: time
        meta: {date_basis: settle}

      # ★ 三个科室口径（dimension，供切换聚合维度）
      - name: order_dept_code
        title: 开单科室
        sql: order_dept_code
        type: string
        meta: {dept_basis: order}
      - name: exec_dept_code
        title: 执行科室
        sql: exec_dept_code
        type: string
        meta: {dept_basis: exec}
      - name: belong_dept_code
        title: 患者归属科室
        sql: belong_dept_code
        type: string
        meta: {dept_basis: belong}

      - name: visit_type
        title: 就诊类型
        sql: visit_type_code
        type: string
      - name: pay_type
        title: 费别
        sql: pay_type_code
        type: string
      - name: campus_code
        title: 院区
        sql: campus_code
        type: string

  # ───────── 住院出院 ─────────
  - name: inpatient_discharge
    title: 住院出院
    sql: >
      SELECT * FROM dwd.dwd_fact_inpatient_discharge
      WHERE data_maturity IN ('settled', 'provisional')

    joins:
      - name: dept
        relationship: many_to_one
        sql: "${CUBE}.discharge_dept_code = ${dept}.dept_code"

    measures:
      - name: ip_discharge_cnt
        title: 出院人次
        type: count
        sql: visit_id
        meta: {unit: 人次, alias: [出院人数, 出院量], date_basis: discharge}

      - name: ip_occupy_bed_days
        title: 出院者占用总床日数
        type: sum
        sql: occupy_bed_days
        meta: {unit: 床日}

      - name: ip_revenue
        title: 住院收入
        type: sum
        sql: total_fee
        format: currency
        meta: {unit: 元, date_basis: settle, sensitivity: restricted}

      - name: ip_material_fee
        title: 住院耗材费用
        type: sum
        sql: material_fee
        format: currency

      - name: ip_los_avg
        title: 平均住院日
        # ★★ 关键：SUM(床日)/SUM(出院人次)，不能 AVG(los_days)
        type: number
        sql: >
          SUM(${CUBE}.occupy_bed_days)
          / NULLIF(COUNT(${CUBE}.visit_id), 0)
        format: decimal
        meta:
          unit: 天
          alias: [平均住院日, 平均住院天数, ALOS]
          notes: 分子必须是占用床日数，不是 SUM(出院日-入院日)

      - name: ip_avg_fee
        title: 住院次均费用
        type: number
        sql: >
          SUM(${CUBE}.total_fee)
          / NULLIF(COUNT(${CUBE}.visit_id), 0)
        format: decimal
        meta: {unit: 元, alias: [住院次均费用, 住院人均花费]}

      - name: material_rate
        title: 百元医疗收入耗材消耗
        type: number
        sql: >
          SUM(${CUBE}.material_fee)
          / NULLIF(SUM(${CUBE}.total_fee), 0) * 100
        format: decimal
        meta: {unit: 元/百元, alias: [耗占比, 百元医疗收入耗材]}

      - name: unplanned_readmit_31d_rate
        title: 31日内非计划再入院率
        type: number
        sql: >
          SUM(${CUBE}.is_unplanned_readmit_31d) * 100.0
          / NULLIF(COUNT(${CUBE}.visit_id), 0)
        format: percent
        meta: {unit: "%", alias: [非计划再入院率, 31天重返率]}

      - name: inpatient_death_rate
        title: 院内死亡率
        type: number
        sql: >
          SUM(${CUBE}.is_death_in_hospital) * 100.0
          / NULLIF(COUNT(${CUBE}.visit_id), 0)
        format: percent
        meta: {unit: "%", sensitivity: restricted}

    dimensions:
      - name: admit_date
        title: 入院日期
        sql: admit_date
        type: time
        meta: {date_basis: admit}
      - name: discharge_date
        title: 出院日期
        sql: discharge_date
        type: time
        meta: {date_basis: discharge}
      - name: settle_date
        title: 结算日期
        sql: settle_date
        type: time
        meta: {date_basis: settle}

      - name: admit_dept_code
        sql: admit_dept_code
        type: string
        meta: {dept_basis: admit}
      - name: discharge_dept_code
        sql: discharge_dept_code
        type: string
        meta: {dept_basis: discharge}
      - name: belong_dept_code
        sql: belong_dept_code
        type: string
        meta: {dept_basis: belong}

      - name: pay_type
        sql: pay_type_code
        type: string
      - name: discharge_type
        sql: discharge_type_code
        type: string
      - name: campus_code
        sql: campus_code
        type: string
      - name: data_maturity
        sql: data_maturity
        type: string

  # ───────── 科室维度 ─────────
  - name: dept
    title: 科室
    sql: >
      SELECT * FROM dim.dim_department WHERE is_current = 1

    dimensions:
      - name: dept_code
        sql: dept_code
        type: string
        primary_key: true
      - name: dept_name
        title: 科室名称
        sql: dept_name
        type: string
        meta: {alias: [科室, 病区]}
      - name: dept_type
        sql: dept_type
        type: string
      - name: campus_name
        title: 院区
        sql: campus_name
        type: string
      - name: parent_dept_name
        title: 科室组
        sql: parent_dept_code
        type: string

# ───────── 预聚合（Cube 的优势：自动生成物化表）─────────
pre_aggregations:
  - name: ip_monthly_by_dept
    type: rollup
    measures: [inpatient_discharge.ip_discharge_cnt, inpatient_discharge.ip_occupy_bed_days]
    time_dimension: inpatient_discharge.discharge_date
    granularity: month
    dimensions: [inpatient_discharge.discharge_dept_code]

  - name: op_monthly_by_dept
    type: rollup
    measures: [outpatient_visit.op_visit_cnt, outpatient_visit.op_revenue]
    time_dimension: outpatient_visit.visit_date
    granularity: month
    dimensions: [outpatient_visit.belong_dept_code]

# ───────── 注意 ─────────
# 1. Cube 的 ratio 度量写成 SQL 表达式时，Cube 会在预聚合中尝试展开，
#    复杂 ratio（如 ip_los_avg）建议拆成两个 measure 后在应用层计算，
#    或使用 Cube 的 `type: number` + rollup 时注意分子分母同时预聚合。
# 2. Cube 提供 REST/SQL API，问数引擎可直接调其 /v1/load 接口，
#    LLM 只需产出 {measures, dimensions, filters, timeDimensions}。
