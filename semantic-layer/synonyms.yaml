# ────────────────────────────────────────────────────────────
# 召回用词表（同义词归一 + 主题域扩展）
#
# 维护约定：
#   1. 本文件只管「怎么找到指标」，不管「指标怎么算」——口径一律在 metric_registry.yaml。
#   2. 新增指标**不需要**改这里：主题域靠 metrics[].domain 自动归并。
#   3. 只有出现「新的口语说法」或「新的主题域」时才改本文件。
#   4. 改动后无需改代码；索引随 registry 热更新重建（未接热更则重启生效）。
# ────────────────────────────────────────────────────────────
version: 1

# 等价词：归一化时把 forms 统一替换为 canonical（按词长降序替换，长词优先）
# 两侧都会归一（问题 + 指标名/别名），所以「出院病人」与「出院患者」能对上。
equivalences:
  - canonical: 患者
    forms: [病人, 病号]
  - canonical: 人次
    forms: [例次]
  - canonical: 收入
    forms: [营收]
  - canonical: 费用
    forms: [花费]
  - canonical: 医师
    forms: [医生, 大夫]
  - canonical: 手术
    forms: [术式]

# 主题域扩展词：问题命中这些词 → 该域下所有指标进入候选（低权重，只保证「进候选」）
# key 必须与 metric_registry.yaml 中 metrics[].domain 的实际取值一致，
# 取值写错的域会被忽略（启动自检会打印告警，不静默生效）。
domains:
  门诊运营: [门诊, 门急诊, 挂号]
  住院运营: [住院, 出院, 入院, 在院, 收治]
  收入: [收入, 费用, 钱, 营收]
  手术: [手术, 台次]
  医保DRG: [DRG, drg, 医保, 权重, CMI, cmi]
  医疗质控: [质控, 死亡, 再入院, 重返, 质量]

# 兜底策略：一个指标都没命中、且指标总数不超过该值时，返回全部指标。
# ★ 默认 0 = 关闭。空候选是「该问题超出语义层范围」的有效信号，应如实答「答不了」；
#   实测开启后，未注册的「床位使用率」会被塞进 8 个无关指标，模型拿「占用床日数」
#   冒充「床位使用率」——把「答不了」变成「答错」。故默认关闭，只在极少数场景临时开。
fallback_max_metrics: 0
