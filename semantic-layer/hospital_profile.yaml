# ── 二、口径规则 ──────────────────────────────────────
# 每条规则 = 给指定指标追加一段 WHERE 条件。
# enabled: true 才生效。默认全部关闭 —— 本院口径由院方拍板，系统不替他决定。
caliber_rules:
  - code: exclude_newborn
    name: 出院人次不计新生儿
    enabled: false
    applies_to: ["ip_discharge_cnt", "ip_admit_cnt", "inpatient_death_cnt", "ip_los_avg"]
    where: "({newborn} IS NULL OR {newborn} NOT IN ('Y', 'B', '1'))"
    note: >-
      对账发现：产科 2023 出院 10,533，HIS 报表同格 5,680。NEWBORN 有 Y/B/1 三种非空取值（另有 NULL）。★ 实测开启后全院差异反而扩大（-5,804 → -17,537），说明 HIS 报表是计入新生儿的，本规则默认不开。
  - code: inpatient_only
    name: 只统计住院科室（排除门诊科室）
    enabled: false
    applies_to: ["ip_discharge_cnt", "ip_admit_cnt", "inpatient_death_cnt", "ip_los_avg"]
    where: "({discharge_dept_code} IN (SELECT DEPT_CODE FROM COMM.DEPT_DICT WHERE OUTP_OR_INP = 1))"
    his_only: true
    note: >-
      对账发现 1.1.1.1 / 1.1.1.2 映射到的是门诊科室（神经内科门诊、心血管门诊），却计入了住院出院人次。★ his_only：规则里引用了 HIS 的 COMM.DEPT_DICT，ADS 上无法执行。
