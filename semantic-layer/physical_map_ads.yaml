# 物理映射：本地 ADS 宽表（A 路线）→ 语义层
#
# 为什么 ADS 也需要一份物理映射（哪怕只有几行）：
#   ADS 宽表的列名基本就是语义层的逻辑名，所以此前认为"ADS 不需要物理映射"。
#   但**语义层声明了、ADS 没有物化的列**是真实存在的：科室口径的三种口径
#   （order / exec / belong）与院区（campus）在宽表里就没有列。
#   后果不是"少一个功能"，而是：只要用户有科室级授权，SQL 里就会注入
#   `belong_dept_code IN (...)` → 数据库报 `no such column` → 科室主任**一条数都问不出来**
#   （而全院范围的人毫无感觉，因为 RLS 对 `["*"]` 不注入）。
#
# 这里声明的映射与 physical_map_his.yaml **完全等价**，所以两条路线出数逐位一致：
#   HIS：belong_dept_code → DEPT_DISCHARGE_FROM，discharge_dept_code → DEPT_DISCHARGE_FROM
#   ADS：belong_dept_code → discharge_dept_code（同一列的两个逻辑名）
# 一旦宽表将来真的物化了独立列，删掉对应行即可，语义层零改动。

hospital: 本地 ADS 宽表（A 路线，SQLite / 生产为 Doris）
dialect: sqlite

columns:
  belong_dept_code: discharge_dept_code     # 镜像无独立归属字段，落回出院科（与 HIS 一致）
  order_dept_code: admit_dept_code          # 开单科室落回入院科（与 HIS 一致）
  exec_dept_code: discharge_dept_code       # 执行科室落回出院科（与 HIS 一致）
  # ⚠️ 宽表未物化院区列（build_ads.py 未抽取）。**显式写 null 表示"这一列不存在"** ——
  #    引擎据此在生成 SQL 前就报出可诊断的错误，而不是拼一条必然失败的 SQL，
  #    让运维去看 `no such column: campus_code` 猜是哪个环节。
  #    启用院区围栏（roles.yaml / 台账里写 campus_scope）前，必须先给宽表补这一列。
  campus_code: null
