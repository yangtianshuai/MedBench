# 组织架构同步映射表（F6.2 · docs/12 §4.2）
#
# 本文件是**唯一**需要院方参与维护的配置：把院内组织架构的"说法"
# （岗位名、科室名、列名）翻译成本产品能判定的事实（角色码、科室码、工号）。
# 人员与科室本身**不在这里** —— 它们来自院内系统的导出/接口，见 `scripts/sync_authz.py`。
#
# ⚠️ 三条不许省的原则：
#   1. 台账锚点是**科室码**，不是科室名（更名会让按名字的授权静默失效或越权）；
#      所以 dept_map 是必需的，缺一条就拒绝导入那一条。
#   2. 映射不到**不许猜**：猜错就是"给错人开了错范围"，比不导危险得多。
#   3. 科室合并/更名走 `dept_alias` 显式声明（SCD2），并在导入时留痕（§4.3）。

version: "示例 v0.1（上线前按院方组织架构替换）"

# ── ① 岗位 / 职称 → 本产品角色码（角色码必须存在于 app/config/roles.yaml）──
role_map:
  院长: 院长
  副院长: 院长
  医务处处长: 医务处
  医务处干事: 医务处
  运营管理部部长: 运营管理部
  运营专员: 运营管理部
  财务处长: 财务处
  会计: 财务处
  医保办主任: 医保办
  科主任: 科室主任
  科室主任: 科室主任
  信息科科长: 信息科
  信息科工程师: 信息科

# ── ② 科室名 → 科室码（左值是院方组织架构里的写法，右值是 HIS/语义层的科室码）──
#    多个写法指向同一码是允许的（简称与全称并存）。
dept_map:
  心血管内科: "0101"
  心内科: "0101"
  神经内科: "0103"
  消化内科: "0104"
  呼吸内科: "0105"
  普通外科: "0201"
  骨科: "0202"
  儿科: "0301"
  急诊科: "0401"

# ── ③ 科室更名 / 合并（docs/12 §4.3 SCD2）──
#    旧码 → 新码：导入时把旧码的授权迁到新码，并写一条 action=remap 的留痕。
#    为什么不用"按名称匹配"：更名后按名称的旧授权会匹配不上而**静默消失**，
#    当事人第二天发现查不了数，而系统里没有任何记录说发生过什么。
dept_alias: {}
  # 示例：心内科与心内二科合并
  # "0102": "0101"

# ── ④ 同步产出的默认值 ──
defaults:
  # 同步来的授权默认有效期（天）。★ 不给"永久"：授权需要定期被重新确认一次，
  # 否则三年后没人说得清"这个人为什么还有权限"。管理端会提前 14 天提示到期。
  valid_days: 365
  # 院区范围：不启用（null）或写码值列表。留空 = 不启用院区围栏（见 roles.yaml 注释）
  campus_scope: null

# ── ⑤ 导出文件/接口的列名映射（院方导出的表头可能不同）──
fields:
  user_id: 工号
  name: 姓名
  dept: 科室
  post: 岗位
  campus: 院区
