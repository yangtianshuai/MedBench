# ============================================================
# dbt + MetricFlow 语义模型示例（成长期标准方案）
# 说明：MetricFlow 无原生 date_basis / dept_basis 概念，
#       本示例通过「多个时间维度 + 多个人科室维度」模拟，
#       查询时由上层服务按口径选择对应维度。这是迁移的关键点。
# ============================================================

version: 2

semantic_models:

  # ───────── 门诊就诊 ─────────
  - name: outpatient_visit
    description: 门诊就诊事实表（粒度：一次就诊）
    model: ref('dwd_fact_outpatient_visit')
    defaults:
      agg_time_dimension: visit_date

    entities:
      - name: visit
        type: primary
        expr: visit_id
      - name: patient
        type: foreign
        expr: patient_id
      - name: dept
        type: foreign
        expr: belong_dept_code
      - name: campus
        type: foreign
        expr: campus_code

    dimensions:
      # ★ 三个时间维度（对应 date_basis: reg / visit / settle）
      - name: reg_date
        label: 挂号日期
        type: time
        type_params: {time_granularity: day}
      - name: visit_date
        label: 就诊日期
        type: time
        type_params: {time_granularity: day}
      - name: settle_date
        label: 结算日期
        type: time
        type_params: {time_granularity: day}

      # ★ 三个科室维度（对应 dept_basis: order / exec / belong）
      - name: order_dept
        label: 开单科室
        type: categorical
        expr: order_dept_code
      - name: exec_dept
        label: 执行科室
        type: categorical
        expr: exec_dept_code
      - name: belong_dept
        label: 患者归属科室
        type: categorical
        expr: belong_dept_code

      - name: visit_type
        label: 就诊类型
        type: categorical
        expr: visit_type_code
      - name: pay_type
        label: 费别
        type: categorical
        expr: pay_type_code
      - name: campus_code
        label: 院区
        type: categorical
        expr: campus_code
      - name: is_valid_visit
        label: 是否有效就诊
        type: categorical
        expr: is_valid_visit

    measures:
      - name: op_visit_cnt
        label: 门诊人次
        description: 有效就诊人次数（不含退号）
        agg: sum
        expr: is_valid_visit
      - name: op_patient_cnt
        label: 门诊人数
        description: 去重患者数
        agg: count_distinct
        expr: patient_id
      - name: op_revenue
        label: 门诊收入
        agg: sum
        expr: total_fee
      - name: op_drug_fee
        label: 门诊药品费用
        agg: sum
        expr: drug_fee

  # ───────── 住院出院 ─────────
  - name: inpatient_discharge
    description: 住院出院事实表（粒度：一次出院）
    model: ref('dwd_fact_inpatient_discharge')
    defaults:
      agg_time_dimension: discharge_date

    entities:
      - name: visit
        type: primary
        expr: visit_id
      - name: patient
        type: foreign
        expr: patient_id
      - name: dept
        type: foreign
        expr: discharge_dept_code

    dimensions:
      - name: admit_date
        label: 入院日期
        type: time
        type_params: {time_granularity: day}
      - name: discharge_date
        label: 出院日期
        type: time
        type_params: {time_granularity: day}
      - name: settle_date
        label: 结算日期
        type: time
        type_params: {time_granularity: day}

      - name: admit_dept
        label: 入院科室
        type: categorical
        expr: admit_dept_code
      - name: discharge_dept
        label: 出院科室
        type: categorical
        expr: discharge_dept_code
      - name: belong_dept
        label: 患者归属科室
        type: categorical
        expr: belong_dept_code

      - name: pay_type
        label: 费别
        type: categorical
        expr: pay_type_code
      - name: discharge_type
        label: 离院方式
        type: categorical
        expr: discharge_type_code
      - name: campus_code
        label: 院区
        type: categorical
        expr: campus_code
      - name: data_maturity
        label: 数据成熟度
        type: categorical
        expr: data_maturity

    measures:
      - name: ip_discharge_cnt
        label: 出院人次
        agg: count
        expr: visit_id
      - name: ip_admit_cnt
        label: 入院人次
        agg: count
        expr: visit_id
      - name: ip_occupy_bed_days
        label: 出院者占用总床日数
        agg: sum
        expr: occupy_bed_days
      - name: ip_revenue
        label: 住院收入
        agg: sum
        expr: total_fee
      - name: ip_drug_fee
        label: 住院药品费用
        agg: sum
        expr: drug_fee
      - name: ip_material_fee
        label: 住院耗材费用
        agg: sum
        expr: material_fee
      - name: unplanned_readmit_31d_cnt
        label: 31日内非计划再入院例数
        agg: sum
        expr: is_unplanned_readmit_31d
      - name: inpatient_death_cnt
        label: 院内死亡例数
        agg: sum
        expr: is_death_in_hospital

  # ───────── 手术 ─────────
  - name: operation
    description: 手术操作事实表
    model: ref('dwd_fact_operation')
    defaults:
      agg_time_dimension: operation_date

    entities:
      - name: operation
        type: primary
        expr: operation_id
      - name: visit
        type: foreign
        expr: visit_id

    dimensions:
      - name: operation_date
        label: 手术日期
        type: time
        type_params: {time_granularity: day}
      - name: exec_dept
        label: 执行科室
        type: categorical
        expr: exec_dept_code
      - name: belong_dept
        label: 患者归属科室
        type: categorical
        expr: belong_dept_code
      - name: operation_level
        label: 手术级别
        type: categorical
        expr: operation_level

    measures:
      - name: surgery_cnt
        label: 手术例数
        agg: count
        expr: operation_id
      - name: surgery_level4_cnt
        label: 四级手术例数
        description: 仅统计手术级别为 4 的手术
        agg: count
        expr: operation_id
        filter: |
          {{ Dimension('operation__operation_level') }} = '4'

  # ───────── DRG 结算 ─────────
  - name: drg_settle
    description: DRG 结算事实表
    model: ref('dwd_fact_drg_settle')
    defaults:
      agg_time_dimension: settle_date

    entities:
      - name: visit
        type: primary
        expr: visit_id

    dimensions:
      - name: settle_date
        label: 结算日期
        type: time
        type_params: {time_granularity: day}
      - name: discharge_dept
        label: 出院科室
        type: categorical
        expr: discharge_dept_code
      - name: drg_code
        label: DRG 组编码
        type: categorical
        expr: drg_code

    measures:
      - name: drg_weight_sum
        label: DRG 总权重
        agg: sum
        expr: drg_weight
      - name: drg_profit_loss
        label: DRG 盈亏
        description: 医保支付额 - 医疗成本（正为结余）
        agg: sum
        expr: drg_payment - medical_cost
