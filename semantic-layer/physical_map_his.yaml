# 物理映射：HIS 镜像（生产库实时全量同步，Oracle 11g）→ 语义层
#
# 这是 F5.3 物理映射的具体落地。
# 接入第二家医院时只改这一份，不动指标定义和引擎。
#
# ⚠️ 目标场景（B 路线 · 直连 HIS 出数）：
#   限于 4 个不需 JOIN 的住院域 atomic 指标 + 1 个 ratio 指标。
#   ip_revenue / ip_drug_fee / material_rate 等需 JOIN 费用明细的指标，
#   走 A 路线（抽数到 ADS 预聚合）后才完整支持。

hospital: 院内 HIS 镜像（生产库实时全量同步，Oracle 11g）
dialect: oracle

# ── 逻辑表 → 物理表 ──
tables:
  dwd_fact_inpatient_discharge: MEDREC.PAT_VISIT
  # 门诊主表 OUTPADM.CLINIC_MASTER 仅 348 行，不映射
  # 费用 INP_BILL_DETAIL 需要 JOIN 暂不映射，留 A 路线处理

# ── 逻辑列 → 物理列 ──
columns:
  visit_id: VISIT_ID
  patient_id: PATIENT_ID
  admit_date: ADMISSION_DATE_TIME
  discharge_date: DISCHARGE_DATE_TIME
  death_date: DEATH_DATE_TIME
  newborn: NEWBORN
  admit_dept_code: DEPT_ADMISSION_TO
  discharge_dept_code: DEPT_DISCHARGE_FROM
  belong_dept_code: DEPT_DISCHARGE_FROM       # 镜像无独立归属字段，落回出院科
  order_dept_code: DEPT_ADMISSION_TO
  exec_dept_code: DEPT_DISCHARGE_FROM
  # ★ 显式 null = "镜像里没有院区列"（PAT_VISIT 未抽取院区字段）。
  #   写 null 而不是不写，是为了让引擎在**生成 SQL 之前**就说清原因：
  #   不写的话，启用院区围栏会拼出 MEDREC.PAT_VISIT.campus_code，
  #   报的是 ORA-00904: invalid identifier —— 现场只会看到"系统坏了"。
  campus_code: null

# ── measure.expr 是 SQL 表达式（不是字段名）时的物理写法 ──
exprs:
  visit_id: VISIT_ID                           # COUNT(...) 的列
  is_valid_visit: "1"                          # 镜像里就诊即视为有效
  is_death_in_hospital: "(CASE WHEN DEATH_DATE_TIME IS NOT NULL THEN 1 ELSE 0 END)"
  occupy_bed_days: "(DISCHARGE_DATE_TIME - ADMISSION_DATE_TIME)"
  # PAT_VISIT 无费用字段，先置 0；以下用 INP_BILL_DETAIL 的指标需走 A 路线
  total_fee: "0"
  drug_fee: "0"
  material_fee: "0"

# ── 按 measure 覆盖：费用类不在就诊主表，而在住院费用明细表 ──
# 同一逻辑事实表 dwd_fact_inpatient_discharge 在本院被拆成两张物理表：
#   就诊 → MEDREC.PAT_VISIT      费用 → INPBILL.INP_BILL_DETAIL
#
# ⚠️ 药品/耗材分类口径（待院方签认，见 var/recon_2023.md）：
#   现用【病案首页分类】CLASS_ON_MR：F*=西药费、G*=中药费、I*=耗材费
#   备选【财务收费分类】ITEM_CLASS：A=西药、B=中药、I=材料
#   另有 CLASS_ON_INP_RCPT（收据）/ CLASS_ON_RECKONING（结算）两套，暂不采用。
measures:
  ip_revenue:
    table: INPBILL.INP_BILL_DETAIL
    expr: COSTS
    date_basis: {settle: BILLING_DATE_TIME}
  ip_drug_fee:
    table: INPBILL.INP_BILL_DETAIL
    expr: "(CASE WHEN CLASS_ON_MR LIKE 'F%' OR CLASS_ON_MR LIKE 'G%' THEN COSTS ELSE 0 END)"
    date_basis: {settle: BILLING_DATE_TIME}
  ip_material_fee:
    table: INPBILL.INP_BILL_DETAIL
    expr: "(CASE WHEN CLASS_ON_MR LIKE 'I%' THEN COSTS ELSE 0 END)"
    date_basis: {settle: BILLING_DATE_TIME}

# ── date_basis 各口径的物理日期列 ──
date_basis:
  admit: ADMISSION_DATE_TIME
  discharge: DISCHARGE_DATE_TIME
  settle: DISCHARGE_DATE_TIME                  # 镜像无结算日，落回出院
  visit: ADMISSION_DATE_TIME
  reg: ADMISSION_DATE_TIME

# ── dept_basis 各口径的物理科室列 ──
dept_basis:
  discharge: DEPT_DISCHARGE_FROM
  admit: DEPT_ADMISSION_TO
  belong: DEPT_DISCHARGE_FROM
  order: DEPT_ADMISSION_TO
  exec: DEPT_DISCHARGE_FROM

# ── 显式指定不映射的 measure（直接报错，便于发现）──
fail_if_unmapped:
  - drug_rate          # 含门诊（op_drug_fee + op_revenue），门诊主表近乎空，暂不支持
  - surgery_cnt
  - surgery_level4_cnt
  - op_visit_cnt       # 门诊主表近乎空表
  - op_patient_cnt
